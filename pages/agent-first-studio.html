<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Studio · Canvas</title>
<style>
:root{--bg:#141318;--pan:#201e26;--line:#37343f;--ink:#ece8e1;--mu:#9b97a7;--ac:#8fd3c1;--warn:#e7b46a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#cv{width:min(100vw,100vh);height:min(100vw,100vh);display:block;cursor:pointer}
#cv[hidden]{display:none!important}
#srcVideo{display:none;max-width:min(100vw,100vh);max-height:min(100vw,100vh);width:auto;height:auto;background:#0e0d12;box-shadow:0 20px 60px #0008}
#srcVideo.on,#srcPoster.on{display:block}#srcPoster{max-width:min(100vw,100vh);max-height:min(100vw,100vh);width:auto;height:auto;background:#0e0d12;box-shadow:0 20px 60px #0008}
.fab{position:fixed;z-index:5;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--pan);display:grid;place-items:center}
.fab:hover:not(:disabled),.fab[aria-expanded=true]{border-color:var(--ac)}
.fab:disabled{opacity:.4;cursor:default}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tDesigns{top:14px;left:14px}#tAsk{top:14px;right:14px}
#tExport{top:14px;right:68px}
#tAdmin{top:19px;left:68px;width:34px;height:34px;font-size:13px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.brandbar{display:grid;gap:5px;margin:0 0 10px;color:var(--mu);font-size:11px}
.brandbar select{width:100%}
#tAdmin[aria-pressed=true]{border-color:var(--ac);background:#2a3532;color:var(--ac)}
#replay{bottom:16px;left:50%;transform:translateX(-50%)}
#tip{position:fixed;z-index:6;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#1b1a20;padding:7px 11px;border-radius:9px;font-size:12.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#tip.on,#replay:hover+#tip,#replay:focus-visible+#tip{opacity:1}
#tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.drawer{position:fixed;z-index:4;top:68px;bottom:14px;width:min(320px,calc(100vw - 28px));background:var(--pan);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.drawer[hidden]{display:none}
#panel{left:14px}#chat{right:14px;width:min(360px,calc(100vw - 28px))}
.dh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.dh h2{margin:0;font-size:14px;font-weight:600}.dh small{color:var(--mu);display:block;font-weight:400}
.db{flex:1;overflow:auto;padding:12px;min-height:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:10px;background:#1a1920;padding:6px;text-align:left}
.card:hover{border-color:var(--ac)}.card canvas,.card img.poster{width:100%;aspect-ratio:1;border-radius:6px;display:block;object-fit:cover}
.card b{display:block;font-size:12px;margin-top:6px;line-height:1.3}.card small{color:var(--mu);font-size:11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:transparent;margin-bottom:7px;text-align:left}
.row:hover{border-color:var(--ac)}.row[aria-current=true]{border-color:var(--ac);background:#2a3532}
.row small{color:var(--mu)}.tag{font-size:10.5px;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:0 7px}
.sec{margin:14px 0 8px;color:var(--mu);font-size:12px}
.lnk{background:none;border:0;color:var(--mu);padding:0}.lnk:hover{color:var(--ink)}
.fmt{margin-top:6px}.fmt .row{margin:0}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px;min-height:0}
.m{max-width:92%;padding:8px 11px;border-radius:12px;background:#2a2832;white-space:pre-wrap;font-size:13px}
.m.u{align-self:flex-end;background:var(--ink);color:#1b1a20}.m.ok{border:1px solid var(--ac)}.m.err{border:1px solid var(--warn)}
.m button{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:2px 9px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 0}
.chips button{font-size:11.5px;border:1px solid var(--line);border-radius:99px;background:transparent;padding:2px 9px}.chips button:hover,.chips button[aria-pressed=true]{border-color:var(--ac)}.chips button[aria-pressed=true]{background:#2a3532}
#form{display:flex;gap:6px;padding:10px 12px}
#in{flex:1;min-width:0;resize:none;height:54px;border:1px solid var(--line);border-radius:9px;background:#17161b;color:var(--ink);font:inherit;padding:7px 9px}
#form button{border:0;background:var(--ac);color:#10211c;font-weight:600;border-radius:9px;padding:0 14px}
select,input{font:inherit;color:var(--ink);background:#17161b;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#toast{position:fixed;z-index:9;left:50%;top:16px;transform:translateX(-50%);background:var(--ac);color:#10211c;padding:9px 14px;border-radius:10px;font-weight:600;max-width:calc(100vw - 140px)}
#toast.err{background:var(--warn)}#toast[hidden]{display:none}
dialog{background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:#000a}dialog label{display:grid;gap:3px;margin:10px 0;font-size:12px;color:var(--mu)}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:14px 0 0}
dialog button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px}
dialog button.p{background:var(--ac);color:#10211c;border:0;font-weight:600}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
</style>
</head>
<body>
<main id="stage"><canvas id="cv" aria-label="Design canvas, fixed 1:1"></canvas><video id="srcVideo" muted playsinline loop preload="auto" aria-label="Source-exact original motion"></video><img id="srcPoster" alt="Source-exact original design" hidden></main>

<button class="fab" id="tDesigns" aria-label="Designs" aria-expanded="false" title="Designs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
<button class="fab" id="tAdmin" aria-label="Admin animation view" aria-pressed="false" title="Admin: include broken animations">A</button>
<button class="fab" id="tAsk" aria-label="Ask the assistant" aria-expanded="false" title="Ask for a new animation, a change or a review"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></button>
<button class="fab" id="tExport" aria-label="Export video" title="Export the current design as a WebM video" disabled><svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M5 20h14"/></svg></button>

<aside class="drawer" id="panel" hidden aria-label="Designs and animations"></aside>

<aside class="drawer" id="chat" hidden aria-label="Assistant">
  <div class="dh"><h2>Assistant<small id="ctxLbl">Pick a design first</small></h2>
    <span><select id="prov" aria-label="Model"><option value="local">Local</option><option value="deepseek">DeepSeek</option></select> <button class="lnk" id="cfgBtn" aria-label="Model settings">⚙</button></span></div>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="groups" aria-label="Element groups in this design"></div>
  <div class="chips" id="chips"></div>
  <form id="form"><textarea id="in" placeholder="Describe the animation, change or problem you see"></textarea><button>Send</button></form>
</aside>

<button class="fab" id="replay" aria-label="Replay animation" disabled><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg></button>
<div id="tip" role="tooltip">Replay · the canvas is always 1:1</div>
<div id="toast" role="status" hidden></div>

<dialog id="cfg"><form method="dialog">
  <h2 style="margin:0 0 4px;font-size:15px">Model settings</h2>
  <p style="margin:0;color:var(--mu);font-size:12px">Saved in this browser only. Local uses an Ollama-style endpoint; any URL ending in /chat/completions is treated as OpenAI-compatible.</p>
  <label>Local endpoint<input id="lUrl"></label><label>Local model<input id="lMod"></label>
  <label>DeepSeek endpoint<input id="dUrl"></label><label>DeepSeek model<input id="dMod"></label>
  <label>DeepSeek API key<input id="dKey" type="password" autocomplete="off"></label>
  <menu><button value="x">Cancel</button><button class="p" id="cfgSave" value="ok">Save</button></menu>
</form></dialog>

<script>
(() => {
'use strict';
/* ============ CONFIG: where the feed comes from ============ */
const API = 'api';
const LIB = 'api/library';                      // built by tools/build-library.py (index.json)
const FEED_STATIC = 'feed/index.json';          // bundled designs + their animations
const FEED_PUBLISHED = true;                    // GET api/brand-packs/:pack/templates?brandId=…
const SAVE_ENDPOINT = id => `${API}/designs/${encodeURIComponent(id)}/animations`; // optional server sync (POST); browser save always happens
const FORMATS = [{id:'orig',label:'Original'},{id:'sq',label:'Square',w:1,h:1,r:'1:1'},{id:'feed',label:'Feed',w:4,h:5,r:'4:5'},{id:'story',label:'Story · Reels',w:9,h:16,r:'9:16'},{id:'wide',label:'Landscape',w:16,h:9,r:'16:9'}];
const DEF = {local:{url:'http://localhost:11434/api/chat',model:'qwen2.5:14b'},deepseek:{url:'https://api.deepseek.com/chat/completions',model:'deepseek-chat',key:''}};

const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const jget = async (u,o) => { const r = await fetch(u,{cache:'no-store',...o}); if(!r.ok) throw new Error(r.status+' '+r.statusText); return r.json(); };
const mk = (tag,props={},...kids) => { const e = Object.assign(document.createElement(tag),props); kids.flat().forEach(k => e.append(k)); return e; };
let toastT = 0;
const toast = (m,err) => { const t=$('#toast'); t.textContent=m; t.className=err?'err':''; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3600); };

/* ============ state ============ */
let LIBIDX = null, CLIPS = null, SEL = new Set();
let ADMIN = LS.get('agentLibrary.admin', false);
let DESIGNS = [], cur = null, curAnim = null, fmt = 'orig', fmtOpen = false, T = 0, playing = false, tStart = 0, raf = 0;
const BRANDS = new Map();
let BRAND = LS.get('sa.brand', '');
let SRC = false;
const IMGS = new Map();

/* ============ animation model ============ */
const EASE = {linear:x=>x, in:x=>x*x*x, out:x=>1-(1-x)**3, inOut:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2};
const nf = f => ({t:f.t||0,dx:f.dx??0,dy:f.dy??0,sx:f.sx??1,sy:f.sy??1,a:f.a??1,r:f.r??0,e:EASE[f.e]?f.e:'linear',clip:f.clip||null,filter:f.filter||''});
const lerp = (a,b,k) => a+(b-a)*k;
function interpClip(a,b,k){
  if(!a) return b||null; if(!b) return a;
  if(a.shape==='rect' && b.shape==='rect') return {shape:'rect',x:lerp(a.x||0,b.x||0,k),y:lerp(a.y||0,b.y||0,k),w:lerp(a.w||100,b.w||100,k),h:lerp(a.h||100,b.h||100,k)};
  return k<.5?a:b;
}
function interp(frames,t){
  if(!frames.length) return nf({});
  if(t<=frames[0].t) return frames[0];
  const L = frames[frames.length-1]; if(t>=L.t) return L;
  let i = 0; while(frames[i+1].t<=t) i++;
  const a = frames[i], b = frames[i+1], k = EASE[b.e]((t-a.t)/((b.t-a.t)||1)), o = {};
  for(const p of ['dx','dy','sx','sy','a','r']) o[p] = a[p]+(b[p]-a[p])*k;
  o.clip = interpClip(a.clip,b.clip,k);
  o.filter = b.filter || a.filter || '';
  return o;
}
function segState(segs,t){
  let s = segs[0]; for(const x of segs) if(x.start<=t) s = x;
  let lt = Math.max(0,t-s.start); const d = s.duration||0;
  lt = s.loop && d ? lt%d : Math.min(lt,d||1e9);
  return interp(s.frames,lt);
}
function prep(data){ // normalise frames once, index tracks by layer
  const a = clone(data); a.byId = {};
  (a.tracks||[]).forEach(tr => { (tr.segments||[]).forEach(s => { s.frames = (s.frames||[]).map(nf).sort((p,q)=>p.t-q.t); s.start=s.start||0; }); if(tr.segments&&tr.segments.length) a.byId[tr.layerId]=tr; });
  return a;
}
function compMotion(comp){ // composition keyframes → animation tracks
  return {schema:'agent-studio/animation/2',kind:'studio-animation',name:comp.name,duration:comp.duration||10000,fps:25,tracks:comp.layers.filter(l=>l.animation&&(l.animation.keyframes||[]).length).map(l=>({layerId:l.id,layerName:l.name,segments:[{preset:'keyframes',label:'Keyframes',start:0,duration:l.animation.duration||comp.duration,loop:false,frames:l.animation.keyframes.map(k=>({t:k.time,dx:(k.x-l.x)/100,dy:(k.y-l.y)/100,sx:l.w?k.w/l.w:1,sy:l.h?k.h/l.h:1,a:k.opacity}))}]}))};
}
const dTitle = d => d.comp.name.split(' — ').slice(-2).join(' — ');
const animLabel = (a,d) => ((a.name||'Animation').replace(d.comp.name,'').replace(/^[\s—–-]+/,'').replace(/^\d+$/,'')||'Original motion');

/* ============ feed ============ */
const brandKeyOf = value => String(value||'').toLowerCase().replace(/&/g,' and ').replace(/\b(?:the|and)\b/g,' ').replace(/[^a-z0-9]+/g,'');
function addDesign(id,comp,src,anims,meta={}){
  let d = DESIGNS.find(x=>x.id===id);
  if(!d){ d = {id,comp,src,anims:[],brandId:'',brandName:'',brandKey:'',packId:''}; DESIGNS.push(d); }
  Object.assign(d,meta);
  if(!d.brandKey) d.brandKey = brandKeyOf(d.brandName || d.brandId);
  if(d.brandKey) BRANDS.set(d.brandKey, d.brandName || d.brandId);
  (anims||[]).forEach(a => { if(a && a.tracks && !d.anims.some(x=>x.data.id===a.id)) d.anims.push({id:a.id||('a'+Math.random().toString(36).slice(2,8)),data:a,saved:!!a._saved}); });
  return d;
}
const titleCase = value => String(value||'').replace(/[-_]+/g,' ').replace(/\b\w/g,ch=>ch.toUpperCase());
const visibleDesigns = () => BRAND ? DESIGNS.filter(d=>d.brandKey===BRAND) : DESIGNS;
async function loadFeed(){
  try{ // library first: only designs marked ready, only animations that validated ok
    LIBIDX = await jget(LIB);
    for(const e of (LIBIDX.designs||[])){
      try{
        const comp = await jget(e.composition);
        const anims = (await Promise.all((e.animations||[]).filter(a=>ADMIN?true:a.status!=='broken').map(a=>jget(a.file).then(x=>Object.assign(x,{_saved:x.origin!=='original',_status:a.status,_issues:a.issues})).catch(()=>null)))).filter(Boolean);
        const d = addDesign(e.id,comp,'Library',anims,{brandId:e.brandId,brandName:titleCase(e.brandId),brandKey:brandKeyOf(e.brandId),sourceVideo:e.sourceVideo||'',sourcePoster:e.sourcePoster||'',sourceWidth:e.sourceWidth||0,sourceHeight:e.sourceHeight||0,sourceDuration:e.sourceDuration||0}); d.detail=e.detail; d.fromLib=true; d.status=e.status; d.issues=e.issues;
      }catch(err){ console.warn('library item failed',e.id,err); }
    }
  }catch(e){ console.warn('library unavailable',e.message); }
  if(FEED_STATIC && !DESIGNS.length) try{
    const idx = await jget(FEED_STATIC);
    for(const e of idx.designs||[]){
      try{ const comp = await jget(e.composition); const anims = (await Promise.all((e.animations||[]).map(u=>jget(u).catch(()=>null)))).filter(Boolean); addDesign(e.id||comp.id,comp,'Feed',anims); }catch(err){ console.warn('feed item failed',e,err); }
    }
  }catch(e){ console.warn('static feed unavailable',e.message); }
  if(FEED_PUBLISHED) try{
    const packs = (await jget(API+'/brand-packs')).packs||[];
    for(const p of packs) for(const b of p.brands||[]){
      try{ const r = await jget(`${API}/brand-packs/${encodeURIComponent(p.id)}/templates?brandId=${encodeURIComponent(b.id)}`);
        (r.templates||[]).filter(t=>t.composition).forEach(t=>addDesign(t.id,t.composition,'Published',[],{brandId:b.id,brandName:b.name,brandKey:brandKeyOf(b.name),packId:p.id})); }catch{}
    }
  }catch(e){ console.warn('published feed unavailable',e.message); }
  const ov = LS.get('sa.comp',{}), sv = LS.get('sa.anims',{});
  DESIGNS.forEach(d => { if(ov[d.id]) d.comp = ov[d.id]; (sv[d.id]||[]).forEach(a=>addDesign(d.id,d.comp,d.src,[{...a,_saved:true}])); if(!d.anims.length){ const m=compMotion(d.comp); if(m.tracks.length) addDesign(d.id,d.comp,d.src,[{...m,id:'motion-'+d.id}]); } });
  if(BRAND && !BRANDS.has(BRAND)) { BRAND = ''; LS.set('sa.brand',''); }
}

/* ============ rendering ============ */
const sameOriginAsset = url => { try{ const u=new URL(String(url),location.href); if((u.hostname==='localhost'||u.hostname==='127.0.0.1'||u.hostname==='[::1]')&&u.origin!==location.origin) return u.pathname+u.search+u.hash; }catch{} return url; };
const getImg = url => { let i = IMGS.get(url); if(!i){ i = new Image(); i.crossOrigin='anonymous'; i.onload=()=>{i.ok=true;paintAll()}; i.onerror=()=>{i.failed=true}; i.src=sameOriginAsset(url); IMGS.set(url,i); } return i; };
function fontFor(comp){ const fams=new Set(); comp.layers.forEach(l=>l.font&&l.font.family&&fams.add(l.font.family)); [...fams].forEach(f=>{ const id='gf-'+f.replace(/\W/g,''); if(!document.getElementById(id)) document.head.append(mk('link',{id,rel:'stylesheet',href:`https://fonts.googleapis.com/css2?family=${encodeURIComponent(f).replace(/%20/g,'+')}:wght@400;700&display=swap`})); document.fonts.load(`700 40px "${f}"`).then(paintAll).catch(()=>{}); }); }
function wrap(ctx,txt,w){ const out=[]; String(txt).split('\n').forEach(par=>{ let line=''; par.split(' ').forEach(wd=>{ const t=line?line+' '+wd:wd; if(line&&ctx.measureText(t).width>w){out.push(line);line=wd}else line=t; }); out.push(line); }); return out; }
function drawText(ctx,l,bw,bh,basePx){
  const f=l.font||{}, fs=(f.sizePct||5)/100*basePx;
  ctx.font=`${f.style==='italic'?'italic ':''}${f.weight||400} ${fs}px "${f.family||'sans-serif'}",sans-serif`;
  if('letterSpacing' in ctx) ctx.letterSpacing=((f.letterSpacingEm||0)*fs)+'px';
  ctx.fillStyle=l.color||'#fff'; ctx.textBaseline='middle';
  let tx=l.text||''; if(f.transform==='uppercase') tx=tx.toUpperCase();
  const lines=wrap(ctx,tx,bw), lh=fs*(f.lineHeight||1.2), tot=lines.length*lh;
  const y0 = l.verticalAlign==='top'?-bh/2:l.verticalAlign==='bottom'?bh/2-tot:-tot/2;
  const al = l.align||'left'; ctx.textAlign=al; const x = al==='left'?-bw/2:al==='right'?bw/2:0;
  lines.forEach((s,i)=>ctx.fillText(s,x,y0+i*lh+lh/2));
  if(f.stroke){ ctx.strokeStyle=f.stroke; ctx.lineWidth=(f.strokeWidthPct||0.5)/100*basePx; ctx.lineJoin='round';
    lines.forEach((s,i)=>ctx.strokeText(s,x,y0+i*lh+lh/2)); }
}
function draw(ctx,S,d,anim,t,fid){
  const comp=d.comp, fm=FORMATS.find(f=>f.id===fid)||FORMATS[0];
  const ar = fm.w ? fm.w/fm.h : comp.width/comp.height;
  let W=S,H=S; ar>=1 ? H=S/ar : W=S*ar;
  const ox=(S-W)/2, oy=(S-H)/2;
  ctx.fillStyle='#0e0d12'; ctx.fillRect(0,0,S,S);
  ctx.save(); ctx.beginPath(); ctx.rect(ox,oy,W,H); ctx.clip(); ctx.fillStyle='#1b1a21'; ctx.fillRect(ox,oy,W,H);
  const car=comp.width/comp.height; let cw=W, ch=H; car>W/H ? ch=W/car : cw=H*car;
  const cx=ox+(W-cw)/2, cy=oy+(H-ch)/2;
  ctx.beginPath(); ctx.rect(cx,cy,cw,ch); ctx.clip();
  [...comp.layers].sort((a,b)=>(a.z||0)-(b.z||0)).forEach(l=>{
    if(l.visible===false) return;
    const tr = anim && anim.byId[l.id], st = tr ? segState(tr.segments,t) : nf({});
    const a = (l.opacity??1)*st.a; if(a<=0.001) return;
    const w=(l.w/100)*st.sx*cw, h=(l.h/100)*st.sy*ch, x=cx+((l.x/100)+st.dx)*cw, y=cy+((l.y/100)+st.dy)*ch;
    ctx.save(); ctx.globalAlpha=Math.min(1,a);
    if(st.filter) ctx.filter=st.filter;

/* Export exactly what the canvas shows, at the current format, as WebM. */
async function exportVideo(){
  if(!cur){ toast('Pick a design first.','err'); return; }
  if(SRC && cur.sourceVideo){
    const a=document.createElement('a'); a.href=cur.sourceVideo; a.download=(cur.id||'design')+'-original.webm'; document.body.append(a); a.click(); a.remove(); toast('Source video exported.'); return;
  }
  if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){ toast('This browser cannot record video.','err'); return; }
  const btn = $('#tExport'); btn.disabled = true; toast('Recording the design…');
  try{
    const S = 1080;
    const target = document.createElement('canvas');
    target.width = S; target.height = S;
    target.style.cssText = 'position:fixed;left:-10000px;top:0;width:1px;height:1px';
    document.body.append(target);
    const ctx = target.getContext('2d');
    const duration = curAnim ? Math.max(500, curAnim.duration || 10000) : Math.min(3000, cur.comp.duration || 3000);
    const exportDesign = { ...cur, lib: null };
    const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(type=>MediaRecorder.isTypeSupported(type));
    const chunks = [];
    const recorder = new MediaRecorder(target.captureStream(30), mime ? { mimeType:mime, videoBitsPerSecond:8e6 } : undefined);
    recorder.ondataavailable = event => { if(event.data && event.data.size) chunks.push(event.data); };
    const stopped = new Promise(resolve => { recorder.onstop = resolve; });
    recorder.start(100);
    const started = performance.now();
    await new Promise(resolve => {
      const tick = () => {
        const t = Math.min(duration, performance.now() - started);
        draw(ctx, S, exportDesign, curAnim, t, fmt);
        if(t < duration) requestAnimationFrame(tick);
        else setTimeout(resolve, 120);
      };
      tick();
    });
    recorder.stop();
    await stopped;
    const safe = String(cur.comp.name || 'design').normalize('NFKD').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase() || 'design';
    const motion = (curAnim ? animLabel(curAnim, cur) : 'still').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase() || 'still';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download = `${safe}-${motion}-${fmt}.webm`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    target.remove();
    toast('Video exported.');
  }catch(error){ toast('Could not export video: '+error.message,'err'); }
  finally{ btn.disabled = !cur; }
}

const SYSTEM = `You are the animation and layout assistant inside a design studio. You receive a COMPOSITION (layers with x,y,w,h in % of the artboard) and the CURRENT ANIMATION (tracks).
Animation schema "agent-studio/animation/2": {"name":string,"duration":ms,"tracks":[{"layerId":string,"segments":[{"preset":"keyframes","start":0,"duration":ms,"loop":false,"frames":[{"t":ms,"dx":n,"dy":n,"sx":n,"sy":n,"a":n,"e":"linear|in|out|inOut"}]}]}]}.

{"reply":"short plain-language answer","animation":{"name":"...","duration":ms,"keepOthers":bool,"tracks":[...]} (only when creating or changing motion),"composition_fixes":[{"layerId":"...","set":{"x":n,"y":n,"w":n,"h":n,"text":"...","color":"#hex","font.sizePct":n,"opacity":n,"visible":bool}}] (only when correcting the composition),"review":[{"layerId":"...","observation":"...","suggestion":"..."}] (only when asked for a review)}.

    ...good.map(t=>{ const l=cur.comp.layers.find(x=>x.id===t.layerId); return {layerId:t.layerId,layerName:l.name,layerType:l.type,role:l.type,text:l.text||'',box:{x:l.x/100,y:l.y/100,w:l.w/100,h:l.h/100},segments:t.segments.map(s=>({preset:'keyframes',label:'Keyframes',start:+s.start||0,duration:+s.duration||raw.duration||10000,loop:!!s.loop,frames:(s.frames||[]).map(f=>({t:+f.t||0,dx:f.dx,dy:f.dy,sx:f.sx,sy:f.sy,a:f.a,e:f.e}))}))}; })];
  const id='studio-animation-'+Date.now().toString(36);
  const data={schema:'agent-studio/animation/2',kind:'studio-animation',id,compositionId:cur.id,origin:'llm',name:`${cur.comp.name} — ${raw.name||'New animation'}`,createdAt:new Date().toISOString(),duration:Math.min(15000,Math.max(1000,+raw.duration||10000)),fps:25,source:{app:'studio-agent',design:cur.comp.name,layerCount:cur.comp.layers.length},tracks};
  let synced=false;
  if(cur.fromLib){ try{ const r=await fetch('api/library/animations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({designId:cur.id,animation:data})}); const j=await r.json().catch(()=>({})); if(r.status===400) return say('That animation does not fit this design, so it was not saved: '+(j.error||'validation failed'),'err'); synced=r.ok; }catch{} }
  const store=LS.get('sa.anims',{}); (store[cur.id]=store[cur.id]||[]).push(data); const ok=LS.set('sa.anims',store);
  const item={id,data:Object.assign(prep(data),{}),saved:true}; item.data.id=id; cur.anims.push(item);
  if(!ok&&!synced) return say('The animation was created but could not be saved: browser storage is full. Free some space and ask again.','err');
  say(`Saved “${raw.name||'New animation'}”. Find it under Animations for this design${synced?' (also stored on the server)':' (stored in this browser)'}.`,'ok'); toast('Animation saved'); selectAnim(item); if(panel.hidden) openPanel(true);
}

/* ============ boot ============ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ openPanel(false); chat.hidden=true; $('#tAsk').setAttribute('aria-expanded','false'); } if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)&&curAnim){ e.preventDefault(); play(); } });
addEventListener('resize',paintAll);
$('#tAdmin').setAttribute('aria-pressed', String(ADMIN));
$('#tAdmin').onclick = () => { LS.set('agentLibrary.admin', !ADMIN); location.reload(); };
$('#tExport').onclick = exportVideo;
// Diagnostic seam for the source-vs-composition fidelity review.
window.__agentFirstQA = {
  designs: () => DESIGNS.map((d) => ({ id:d.id, name:d.name, brand:d.brandName, anims:d.anims.map(a=>a.data.id), fmt })),
  select: (id) => { const d = DESIGNS.find(x => x.id === id); if (!d) return false; selectDesign(d); return true; },
  anim: (id) => { if (!cur) return false; const a = cur.anims.find(x => x.id === id || x.data.id === id); if (!a) return false; selectAnim(a); return true; },
  frame: (t, fmtId = null) => {
    if (!cur) return null;
    const S = 1080, out = document.createElement('canvas');
    out.width = S; out.height = S;
    draw(out.getContext('2d'), S, { ...cur, lib: null }, curAnim, Math.max(0, Number(t) || 0), fmtId || fmt);
    return out.toDataURL('image/png');
  },
};
(async()=>{ paintMain(); try{ const f=await jget(API+'/fonts'); for(const x of f.fonts||[]) if(x.family&&x.url){ try{ const ff=new FontFace(x.family,`url("${x.url}")`,{weight:'100 1000'}); await ff.load(); document.fonts.add(ff);}catch{} } }catch{}
  await loadFeed(); say('Pick a design, choose an animation, then ask me for a new animation, a change, or a review of what you see.'); })();
})();
</script>
