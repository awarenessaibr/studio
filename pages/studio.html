<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Studio</title>
<style>
/* ==========================================================================
   Dual theme system (system | light | dark)
   ========================================================================== */
:root {
  /* Dark (default) */
  --bg: #131217;
  --pan: #19181e;
  --rai: #23222b;
  --line: #2c2b35;
  --hi: #3a3946;
  --tx: #ecebf1;
  --mu: #8d8b9a;
  --ac: #e8803a;
  --ok: #41baae;
  --warn: #f5b942;
  --err: #e5584c;
  --err-bg: #7a2b25;
  --chip-bg: #1e1d24ee;
  --shadow: 0 10px 40px #0007;
  --safe: #00c2ff;
  color-scheme: dark;
}

html[data-theme="light"],
html[data-theme="system"]:not(.dark) {
  --bg: #e9e7ee;
  --pan: #ffffff;
  --rai: #f1eff5;
  --line: #d9d6e0;
  --hi: #c9c6d3;
  --tx: #1b1a24;
  --mu: #6c6a79;
  --ac: #d46a1f;
  --ok: #2a9d8f;
  --warn: #c9921a;
  --err: #c13c32;
  --err-bg: #9b2c24;
  --chip-bg: #2a2933ee;
  --shadow: 0 10px 36px rgba(0,0,0,.12);
  --safe: #0088cc;
  color-scheme: light;
}

html[data-theme="dark"],
html[data-theme="system"].dark {
  --bg: #131217;
  --pan: #19181e;
  --rai: #23222b;
  --line: #2c2b35;
  --hi: #3a3946;
  --tx: #ecebf1;
  --mu: #8d8b9a;
  --ac: #e8803a;
  --ok: #41baae;
  --warn: #f5b942;
  --err: #e5584c;
  --err-bg: #7a2b25;
  --chip-bg: #1e1d24ee;
  --shadow: 0 10px 40px #0007;
  --safe: #00c2ff;
  color-scheme: dark;
}

/* Fallback for older browsers that only understand prefers-color-scheme */
@media (prefers-color-scheme: light) {
  html[data-theme="system"]:not(.dark) {
    --bg: #e9e7ee;
    --pan: #ffffff;
    --rai: #f1eff5;
    --line: #d9d6e0;
    --hi: #c9c6d3;
    --tx: #1b1a24;
    --mu: #6c6a79;
    --ac: #d46a1f;
    --ok: #2a9d8f;
    --warn: #c9921a;
    --err: #c13c32;
    --err-bg: #9b2c24;
    --chip-bg: #2a2933ee;
    --shadow: 0 10px 36px rgba(0,0,0,.12);
    --safe: #0088cc;
    color-scheme: light;
  }
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  height: 100%;
}
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 13px/1.45 "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }

button, select {
  font: inherit;
  color: inherit;
  background: var(--rai);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 5px 9px;
  cursor: pointer;
  transition: border-color .15s, background .15s, opacity .15s;
}
button:hover, select:hover { border-color: var(--ac); }
button:disabled, select:disabled {
  opacity: .5;
  cursor: default;
  border-color: var(--line);
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 1px;
}

/* ==========================================================================
   Layout
   ========================================================================== */
#app {
  --left-panel: 270px;
  --right-panel: 390px;
  height: 100%;
  display: grid;
  grid-template-columns: var(--left-panel) 10px 1fr 10px var(--right-panel);
  grid-template-rows: 48px 1fr;
}

.resize-handle {
  position: relative;
  background: var(--pan);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  cursor: col-resize;
  user-select: none;
  touch-action: none;
}
.resize-handle::before {
  content: "";
  position: absolute;
  inset: 0 2px;
  pointer-events: none;
  background: linear-gradient(90deg, transparent 0, transparent 35%, var(--line) 35%, var(--line) 65%, transparent 65%, transparent 100%);
  opacity: .5;
}
.resize-handle:hover::before,
.resize-handle:active::before { opacity: 1; }
.resize-handle:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: -2px;
}
.resize-handle[data-collapsed] { background: var(--rai); }
.resize-handle[data-collapsed]::before { display: none; }
.resize-handle[data-collapsed]::after {
  content: '›';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18px;
  line-height: 1;
  color: var(--mu);
}
.resize-handle[data-resize="right"][data-collapsed]::after { content: '‹'; }
.resize-handle[data-collapsed]:hover::after { color: var(--ac); }

#app.l-collapsed aside,
#app.r-collapsed .agent { visibility: hidden; border: 0; }

/* ==========================================================================
   Header
   ========================================================================== */
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  background: var(--pan);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
header b { font-size: 14px; white-space: nowrap; }
header .sp { flex: 1; }
header select { max-width: 190px; text-overflow: ellipsis; }
header a {
  color: var(--mu);
  text-decoration: none;
  font-size: 12px;
  white-space: nowrap;
}
header a:hover { color: var(--tx); }
.logo {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--ac);
  display: grid;
  place-items: center;
  color: #131317;
  font-weight: 800;
  flex: none;
}
.bsw {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  min-width: 0;
  flex: 0 1 auto;
  padding: 2px 0;
  scrollbar-width: thin;
}
.bsw button {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  border-radius: 99px;
  padding: 3px 10px;
}
.bsw button[aria-pressed="true"] {
  border-color: var(--ac);
  background: var(--hi);
}
.bsw i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid var(--hi);
  flex: none;
}
#net {
  color: var(--warn);
  font-size: 12px;
  white-space: nowrap;
}

/* Theme toggle */
.theme-toggle {
  display: flex;
  gap: 2px;
  background: var(--rai);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px;
}
.theme-toggle button {
  padding: 3px 8px;
  border: 0;
  background: transparent;
  border-radius: 6px;
  font-size: 12px;
  color: var(--mu);
}
.theme-toggle button[aria-pressed="true"] {
  background: var(--hi);
  color: var(--tx);
  border: 1px solid var(--line);
}

/* ==========================================================================
   Sidebars & panels
   ========================================================================== */
aside {
  background: var(--pan);
  border-right: 1px solid var(--line);
  overflow: auto;
  min-height: 0;
  min-width: 0;
}
h3 {
  margin: 0;
  padding: 10px 12px 6px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mu);
}
h3 small {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 400;
}
h3[data-sec] {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 6px;
  cursor: pointer;
  user-select: none;
}
h3[data-sec]::before {
  content: '▾';
  font-size: 10px;
  color: var(--mu);
  width: 10px;
  display: inline-block;
  transition: transform .15s;
}
h3[data-sec][aria-expanded="false"]::before { transform: rotate(-90deg); }
h3[data-sec]:hover { color: var(--tx); }
h3[data-sec]:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: -2px;
}
.sec-body[hidden] { display: none; }

.atabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 10px 10px 6px;
}
.atabs button { flex: 1; padding: 4px 6px; font-size: 12px; }
.atabs button[aria-selected="true"] {
  border-color: var(--ac);
  background: var(--hi);
}
.sub {
  padding: 2px 12px 4px;
  color: var(--mu);
  font-size: 11px;
}
.assets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 10px 8px;
}
.asset {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--rai);
  padding: 6px;
  cursor: grab;
  font-size: 11px;
  text-align: center;
  min-width: 0;
}
.asset[data-choice] { cursor: pointer; }
.asset[data-photo] { cursor: zoom-in; }
.asset[data-photo]:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
.asset:hover { border-color: var(--ac); }
.asset.is-selected {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 12%, transparent), color-mix(in srgb, var(--ac) 4%, transparent));
}
.asset .th {
  height: 46px;
  border-radius: 5px;
  margin-bottom: 4px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  font: 700 11px Georgia, serif;
}
.asset .th img {
  max-width: 92%;
  max-height: 84%;
  object-fit: contain;
}
.asset span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.asset .st {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warn);
  margin-right: 4px;
}
.asset .st[data-s="verified"],
.asset .st[data-s="approved"] { background: var(--ok); }
.asset .st[data-s="rejected"] { background: var(--err); }

/* Menus tab: dish and offer chips that drop onto the canvas as designed
   blocks, plus the section and whole-menu variants that group them. */
.menu-panel { padding: 0 0 10px; }
.menu-panel .flt { padding: 0 10px 8px; }
.menu-group { margin: 0 0 10px; }
.menu-group h3 { display: flex; align-items: baseline; gap: 6px; }
.menu-group h3 small { font-weight: 400; color: var(--mu); font-size: 10px; }
.menu-group > .note { margin: 0 10px 6px; }
.menu-source {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 10px 6px;
  padding: 7px 9px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: var(--rai);
  cursor: grab;
  font-size: 11px;
  color: var(--mu);
}
.menu-source b {
  color: var(--tx);
  font: 700 11px/1.3 Georgia, serif;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.menu-source:hover { border-color: var(--ac); }
.menu-post {
  display: inline-block;
  margin: 0 10px 6px;
  color: var(--ac);
  font-size: 11px;
  text-decoration: none;
}
.menu-post:hover { text-decoration: underline; }
.menu-sec {
  margin: 0 10px 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--rai);
  overflow: hidden;
}
.menu-sec > summary {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px 9px;
  cursor: pointer;
  font-size: 11px;
  list-style: none;
}
.menu-sec > summary::-webkit-details-marker { display: none; }
.menu-sec > summary::before {
  content: "▸";
  color: var(--mu);
  font-size: 9px;
  line-height: 1;
}
.menu-sec[open] > summary::before { content: "▾"; }
.menu-sec > summary b { font-weight: 600; }
.menu-sec > summary span { margin-left: auto; color: var(--mu); font-size: 10px; white-space: nowrap; }
.menu-sec .menu-drop {
  display: grid;
  grid-template-columns: 1fr;
  gap: 3px;
  padding: 2px 6px 6px;
}
.menu-chip {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  padding: 5px 7px;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: grab;
  font-size: 11px;
  text-align: left;
}
.menu-chip:hover { border-color: var(--ac); background: var(--hi); }
.menu-chip .mc-n {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.menu-chip .mc-p { color: var(--mu); font-variant-numeric: tabular-nums; white-space: nowrap; }
.menu-chip .mc-d {
  display: none;
  flex-basis: 100%;
  color: var(--mu);
  font-size: 10px;
  line-height: 1.35;
}
.menu-chip:hover .mc-d { display: block; }
.menu-chip .mc-tag {
  padding: 0 4px;
  border-radius: 4px;
  background: var(--hi);
  color: var(--mu);
  font-size: 9px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.menu-offer { border-left: 3px solid var(--ac); }
/* Venue rooms and hire terms: reference detail for a function brief, so it
   sits under the offers without pretending to be draggable content. */
.menu-rooms { margin: 2px 10px 8px; }
.menu-rooms h4,
.menu-terms > summary {
  margin: 8px 0 4px;
  color: var(--mu);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.menu-room {
  padding: 5px 0;
  border-top: 1px solid var(--line);
  font-size: 11px;
  line-height: 1.35;
}
.menu-room b { font-weight: 600; }
.menu-room span,
.menu-room small { display: block; color: var(--mu); font-size: 10px; }
.menu-terms { margin: 2px 10px 8px; }
.menu-terms > summary { cursor: pointer; list-style: none; }
.menu-terms > summary::-webkit-details-marker { display: none; }
.menu-terms > summary::before { content: "▸ "; }
.menu-terms[open] > summary::before { content: "▾ "; }
.menu-terms ul { margin: 4px 0 0 14px; padding: 0; color: var(--mu); font-size: 10px; line-height: 1.4; }
.menu-terms li + li { margin-top: 3px; }
.menu-empty { padding: 0 12px 10px; color: var(--mu); font-size: 11px; }

.eng-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 10px 8px;
  max-height: 300px;
  overflow: auto;
}
.eng-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--rai);
  padding: 5px;
  cursor: pointer;
  font-size: 11px;
  text-align: center;
  min-width: 0;
  color: inherit;
}
.eng-card:hover { border-color: var(--ac); }
.eng-card.is-selected {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
}
.eng-card canvas {
  display: block;
  width: 100%;
  height: auto;
  max-height: 150px;
  object-fit: contain;
  border-radius: 4px;
  background: color-mix(in srgb, var(--tx) 8%, transparent);
  margin-bottom: 4px;
}
.eng-card span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.eng-motif {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  padding: 0 10px 8px;
}
.eng-mt {
  padding: 3px;
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--rai);
  min-width: 0;
  color: inherit;
}
.eng-mt:hover { border-color: var(--ac); }
.eng-mt[aria-pressed="true"] {
  border-color: var(--ac);
  background: var(--hi);
}
.eng-mt canvas {
  display: block;
  width: 100%;
  height: 34px;
  object-fit: contain;
  border-radius: 4px;
  margin-bottom: 2px;
}
.eng-mt span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.eng-sl {
  padding: 0 12px 7px;
  font-size: 11px;
  color: var(--mu);
}
.eng-sl label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2px;
}
.eng-sl input { width: 100%; }
.eng-row {
  display: flex;
  gap: 6px;
  padding: 0 12px 8px;
  align-items: center;
}
.eng-row button { padding: 3px 9px; }
.eng-sel {
  display: block;
  width: calc(100% - 20px);
  margin: 0 10px 8px;
}
.template-list,
.mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 10px 8px;
}
.mini-grid { grid-template-columns: 1fr; }
.mini-grid .asset { min-height: 92px; }
.template-list .asset .th,
.mini-grid .asset .th {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.flt {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 0 10px 8px;
  font-size: 12px;
  color: var(--mu);
}
.flt select {
  flex: 1;
  min-width: 0;
  padding: 3px 6px;
}
.note {
  padding: 0 12px 10px;
  color: var(--mu);
  font-size: 12px;
}
.note a { color: var(--ac); }
.sw {
  display: flex;
  gap: 4px;
  padding: 0 12px 8px;
  flex-wrap: wrap;
}
.sw button {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--hi);
  padding: 0;
}
.lrow {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
}
.lrow:hover { background: var(--rai); }
.lrow[data-s="1"] {
  background: var(--hi);
  border-left-color: var(--ac);
}
.lrow[data-m="1"] { box-shadow: inset 2px 0 var(--ac); }
.lrow span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lrow small { color: var(--mu); }
.lrow button {
  padding: 1px 6px;
  border: 0;
  background: transparent;
  color: var(--mu);
}

/* ==========================================================================
   Main stage
   ========================================================================== */
main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.tb {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--pan);
  flex-wrap: wrap;
}
.tb .sp { flex: 1; }
.tb label {
  color: var(--mu);
  display: flex;
  gap: 5px;
  align-items: center;
}
.wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tx) 6%, transparent), transparent);
}
.marquee {
  position: absolute;
  z-index: 10002;
  border: 1px solid var(--ac);
  background: color-mix(in srgb, var(--ac) 18%, transparent);
  pointer-events: none;
}
.stage {
  container-type: size;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  flex: none;
  width: 300px;
  height: 424px;
}
.L {
  position: absolute;
  overflow: hidden;
  touch-action: none;
  cursor: move;
}
.T { display: flex; align-items: center; }
.sel {
  outline: 2px solid #fff;
  outline-offset: -2px;
}
.multi-sel {
  outline: 2px dashed var(--ac);
  outline-offset: -2px;
}
.chip {
  position: absolute;
  left: 0;
  top: 0;
  background: var(--chip-bg);
  color: #fff;
  font: 11px Arial;
  padding: 2px 8px;
  border-radius: 99px;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}
/* A dropped menu dish or venue offer. The layer stays a text layer; this is
   the same block paintMenuBlock draws for export, in CSS. */
.L.mb-host { align-items: stretch; }
.mb {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: .16em .2em;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  text-align: left;
}
.mb-sec {
  font-size: .74em;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ac);
  border-bottom: 1px solid color-mix(in srgb, var(--ac) 30%, transparent);
  padding-bottom: .12em;
  margin-bottom: .34em;
}
.mb-sec:not(:first-child) { margin-top: .72em; }
.mb-item + .mb-item { margin-top: .62em; }
.mb-row { display: flex; align-items: baseline; gap: .7em; }
.mb-n { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }
.mb-p { flex: 0 0 auto; font-weight: 700; font-size: .92em; white-space: nowrap; }
.mb-d { font-size: .56em; line-height: 1.34; opacity: .68; margin-top: .06em; }
.mb-offer .mb-n { font-weight: 700; }
.mb-offer .mb-p { color: var(--ac); }
.mb-offer .mb-d { font-size: .62em; }

/* ==========================================================================
   Timeline
   ========================================================================== */
main {
  --timeline-height: 178px;
}
.tl {
  height: var(--timeline-height);
  flex: none;
  border-top: 1px solid var(--line);
  background: var(--pan);
  display: flex;
  flex-direction: column;
  min-height: 0;
  transition: height .15s ease;
}
.tl[data-collapsed="true"] {
  height: 12px;
  border-top: 1px solid var(--line);
}
.tl[data-collapsed="true"] .tlh,
.tl[data-collapsed="true"] .tlb {
  display: none;
}
.timeline-resize-handle {
  position: relative;
  height: 10px;
  background: var(--pan);
  border-top: 1px solid var(--line);
  cursor: row-resize;
  user-select: none;
  touch-action: none;
}
.timeline-resize-handle::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 38px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent 0%, var(--line) 20%, var(--line) 80%, transparent 100%);
}
.timeline-resize-handle[data-collapsed="true"]::before {
  width: 18px;
  background: linear-gradient(90deg, transparent 0%, var(--ac) 20%, var(--ac) 80%, transparent 100%);
}
.timeline-resize-handle[data-collapsed="true"]::after {
  content: '⌃';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ac);
  font-size: 14px;
  line-height: 1;
}
.tlh {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 6px 12px;
  border-bottom: 1px solid var(--line);
}
.tlh input[type=range] { flex: 1; }
.tlh output {
  font-variant-numeric: tabular-nums;
  color: var(--mu);
  min-width: 96px;
  text-align: right;
}
.tlb {
  flex: 1;
  overflow: auto;
  position: relative;
}
.tr {
  display: grid;
  grid-template-columns: 116px 1fr;
  height: 20px;
  align-items: center;
}
.tr .n {
  padding: 0 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: var(--mu);
  cursor: pointer;
}
.tr[data-s="1"] .n { color: var(--tx); }
.tr.drop-target .tk { outline: 1px solid var(--ac); outline-offset: -1px; }
.tk {
  position: relative;
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%);
}
.bar {
  position: absolute;
  top: 3px;
  height: 14px;
  border-radius: 4px;
  background: var(--ac);
  cursor: grab;
  min-width: 6px;
}
.bar.selected { outline: 2px solid var(--tx); outline-offset: 1px; z-index: 2; }
.bar::after {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 7px;
  cursor: ew-resize;
  background: color-mix(in srgb, #000 30%, transparent);
  border-radius: 0 4px 4px 0;
}
.bar i {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: color-mix(in srgb, #131317 55%, transparent);
  pointer-events: none;
}
.bar span {
  display: block;
  font: 700 9px/14px Arial;
  color: #131317;
  padding-left: 5px;
  white-space: nowrap;
  overflow: hidden;
}
.ph {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #fff;
  pointer-events: none;
  z-index: 3;
  left: calc(116px + (100% - 116px) * var(--p, 1));
}
.warn { color: var(--warn); }

/* Selection handles and the layer context menu */
.hnd {
  position: absolute;
  width: 11px;
  height: 11px;
  box-sizing: border-box;
  border: 1.5px solid #111;
  border-radius: 2px;
  background: #fff;
  z-index: 10000;
  opacity: 0;
  touch-action: none;
}
.L.sel .hnd { opacity: 1; }
/* On very small layers the middle handles would cover the whole box, leaving
   nothing to drag by — keep only the corners. */
.L.tiny-h .hnd[data-h="n"],
.L.tiny-h .hnd[data-h="s"],
.L.tiny-w .hnd[data-h="w"],
.L.tiny-w .hnd[data-h="e"] { display: none; }
.hnd[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; }
.hnd[data-h="n"] { left: 50%; top: 0; margin-left: -5.5px; cursor: ns-resize; }
.hnd[data-h="ne"] { right: 0; top: 0; cursor: nesw-resize; }
.hnd[data-h="e"] { right: 0; top: 50%; margin-top: -5.5px; cursor: ew-resize; }
.hnd[data-h="se"] { right: 0; bottom: 0; cursor: nwse-resize; }
.hnd[data-h="s"] { left: 50%; bottom: 0; margin-left: -5.5px; cursor: ns-resize; }
.hnd[data-h="sw"] { left: 0; bottom: 0; cursor: nesw-resize; }
.hnd[data-h="w"] { left: 0; top: 50%; margin-top: -5.5px; cursor: ew-resize; }
.hnd[data-h="rot"] {

  top: 3px;

}

function beginMarquee(ev){

/* ---------- resizing, layer areas and the right-click menu ---------- */
const HANDLES=['nw','n','ne','e','se','s','sw','w'];
const MIN_SIDE=1,SAFE_INSET=8;

/* Which region of the design a layer belongs to. Mirrors the keys in GEO, so a
   dropped photograph knows it is meant for the photograph area. */
const ROLE_WORDS=[[/^(sub|kicker|eyebrow|dek)/i,'sub'],[/head|title|display/i,'head'],[/body|copy|paragraph|deck/i,'body'],[/cta|button|action/i,'cta'],[/foot|legal|fine|credit/i,'foot'],[/logo|mark|wordmark|icon/i,'logo'],[/photo|image|picture|hero|shot/i,'photo']];
const ROLE_LABEL={photo:'photograph',logo:'logo',head:'headline',sub:'sub-headline',body:'body',cta:'call to action',foot:'footer'};
const SLOTS=new Map();
function roleOf(l){
 if(!l)return '';
 if(l.type==='logo')return 'logo';
 if(l.type==='image')return /logo|mark|icon|badge|wordmark/i.test(l.name||'')?'logo':'photo';
 if(l.type!=='text')return '';
 const hit=ROLE_WORDS.find(([re])=>re.test(l.name||''));
 return hit?hit[1]:'';
}
/* A removed layer leaves its rectangle behind so the next asset of the same kind
   can drop straight back into it. */
function rememberSlot(l){
 const role=roleOf(l);if(!role)return;
 SLOTS.set(role,{x:l.x,y:l.y,w:l.w,h:l.h,fit:l.fit,label:`${ROLE_LABEL[role]} area`});
}

/* The area this layer is supposed to occupy: the rectangle the design reserves
   for it (GEO), the rectangle a removed sibling left behind, or — failing both —
   the largest same-kind layer on the stage, then the safe margins. */
function areaFor(l){
 const role=roleOf(l);
 const memo=role&&SLOTS.get(role);
 if(memo)return {...memo};
 const g=FMT&&(GEO[FMT.id]||GEO.a4),slot=g&&role&&g[role];
 if(slot)return {x:slot[0],y:slot[1],w:slot[2],h:slot[3],label:`${ROLE_LABEL[role]} area`};
 const peer=role&&scene.find(q=>q!==l&&!q.hidden&&roleOf(q)===role);
 if(peer)return {x:peer.x,y:peer.y,w:peer.w,h:peer.h,fit:peer.fit,label:`${ROLE_LABEL[role]} area`};
 return {x:SAFE_INSET,y:SAFE_INSET,w:100-SAFE_INSET*2,h:100-SAFE_INSET*2,label:'safe area'};
}

function remapKf(l,from,to){
 const keys=layerKeyframes(l);if(!Array.isArray(keys)||!keys.length)return;
 const sx=(to.w||1)/(from.w||1),sy=(to.h||1)/(from.h||1);
 setLayerKeyframes(l,keys.map(k=>({...k,
  x:+(to.x+(k.x-from.x)*sx).toFixed(2),y:+(to.y+(k.y-from.y)*sy).toFixed(2),
  w:+(k.w*sx).toFixed(2),h:+(k.h*sy).toFixed(2)})));
}

/* Text boxes hold no intrinsic size, so shrink the type until it fits again. */
function fitTextInBox(l){
 try{const[fitted]=fitScene([clone(l)]);if(fitted&&fitted.font)l.font.sizePct=fitted.font.sizePct}catch{}
}

function resizeLayer(ev,l,dir,el){
 if(ev.button)return;ev.preventDefault();ev.stopPropagation();
 if(sel!==l.id)select(l.id);
 const box=stage.getBoundingClientRect();
 const sx=ev.clientX,sy=ev.clientY,o={x:l.x,y:l.y,w:l.w,h:l.h};
 const asp=(o.w*FMT.w)/(o.h*FMT.h)||1;
 const keys=layerKeyframes(l),kf0=Array.isArray(keys)?clone(keys):null,f0=l.font?l.font.sizePct:0;
 let moved=false;
 const mv=m=>{
  if(!moved){hist.push(clone(scene));moved=true}
  const dx=(m.clientX-sx)/box.width*100,dy=(m.clientY-sy)/box.height*100;
  let x=o.x,y=o.y,w=o.w,h=o.h;
  if(dir.includes('w')){x=o.x+dx;w=o.w-dx}
  if(dir.includes('e'))w=o.w+dx;
  if(dir.includes('n')){y=o.y+dy;h=o.h-dy}
  if(dir.includes('s'))h=o.h+dy;
  if(m.shiftKey&&dir.length===2){h=w*FMT.w/(asp*FMT.h);if(dir.includes('n'))y=o.y+o.h-h}
  if(w<MIN_SIDE){w=MIN_SIDE;if(dir.includes('w'))x=o.x+o.w-MIN_SIDE}
  if(h<MIN_SIDE){h=MIN_SIDE;if(dir.includes('n'))y=o.y+o.h-MIN_SIDE}
  if(f0&&dir!=='e'&&dir!=='w')l.font.sizePct=+clamp(f0*(h/o.h),.4,24).toFixed(2);
  if(kf0){
   const kx=(w||1)/(o.w||1),ky=(h||1)/(o.h||1);
   setLayerKeyframes(l,kf0.map(k=>({...k,
    x:+(x+(k.x-o.x)*kx).toFixed(2),y:+(y+(k.y-o.y)*ky).toFixed(2),
    w:+(k.w*kx).toFixed(2),h:+(k.h*ky).toFixed(2)})));
  }
  l.x=+x.toFixed(2);l.y=+y.toFixed(2);l.w=+w.toFixed(2);l.h=+h.toFixed(2);
  Object.assign(el.style,{left:l.x+'%',top:l.y+'%',width:l.w+'%',height:l.h+'%'});
  if(f0)el.style.fontSize=l.font.sizePct+'cqh';

 };
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(!moved)return;if(f0)fitTextInBox(l);render();layers();say('agent',`Resized <b>${esc(l.name)}</b> to ${l.w} × ${l.h}%.`)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);
}

/* Rotation is a layer-level offset: keyframes may animate their own rotation,
   and this value turns the whole result around the layer centre. */
function rotateLayer(ev,l,el){
 if(ev.button)return;ev.preventDefault();ev.stopPropagation();

 const start=Math.atan2(ev.clientY-cy,ev.clientX-cx),base=+l.rotation||0;
 let moved=false;
 const mv=m=>{
  if(!moved){hist.push(clone(scene));moved=true}
  let deg=base+(Math.atan2(m.clientY-cy,m.clientX-cx)-start)*180/Math.PI;
  if(m.shiftKey)deg=Math.round(deg/15)*15;
  deg=((deg+180)%360+360)%360-180;

  removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
  if(!moved)return;

// Published templates animate x/y/w/h/opacity with keyframes; the studio plays

// Exported compositions store the same track under `animation`/`animations`,
// so accept all three shapes when loading.
function compositionKeyframeSource(l){

// type against the stage WIDTH, while the composition schema and every other

// gets clipped. Convert once on the way into the scene; exported compositions

async function savedThumb(cv,tpl){

 await Promise.all(layers.filter(l=>l.url&&l.type!=='text').map(async l=>{try{imgs.set(l,await loadImg(absUrl(l.url)))}catch{}}));
 layers.forEach(l=>{
  const rx=(+l.x||0)/100*W,ry=(+l.y||0)/100*H,rw=Math.max(1,(+l.w||100)/100*W),rh=Math.max(1,(+l.h||10)/100*H),im=imgs.get(l);
  if(im){try{x.save();x.beginPath();x.rect(rx,ry,rw,rh);x.clip();const s=Math.max(rw/(im.naturalWidth||1),rh/(im.naturalHeight||1)),iw=(im.naturalWidth||1)*s,ih=(im.naturalHeight||1)*s;x.drawImage(im,rx+(rw-iw)/2,ry+(rh-ih)/2,iw,ih);x.restore()}catch{}return}
  if(l.type!=='text'&&!l.text)return;
  const f=l.font||{},fs=Math.max(2.5,(+f.sizePct||2)/100*H),line=String(l.text||'').split('\n')[0];

 });
}

async function videoPosterDataUrl(file){
 const url=URL.createObjectURL(file);
 try{
  const video=document.createElement('video');
  video.preload='auto';video.muted=true;video.playsInline=true;video.src=url;
  await new Promise((resolve,reject)=>{
   let settled=false;
   const ok=()=>{if(settled)return;settled=true;resolve()};
   const bad=()=>{if(settled)return;settled=true;reject(new Error(`Could not read the video ${file.name||''}.`))};
   video.addEventListener('loadeddata',ok,{once:true});
   video.addEventListener('error',bad,{once:true});
   setTimeout(bad,12000);
  });
  const width=video.videoWidth||1,height=video.videoHeight||1;
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('This browser cannot read that video.');
  if(Number.isFinite(video.duration)&&video.duration>0){
   video.currentTime=Math.min(video.duration*.1,Math.max(0,video.duration-.05));
   await new Promise(resolve=>{
    let done=false;
    const finish=()=>{if(done)return;done=true;video.removeEventListener('seeked',finish);resolve()};
    video.addEventListener('seeked',finish,{once:true});
    video.addEventListener('error',finish,{once:true});
    setTimeout(finish,900);
   });
  }
  ctx.drawImage(video,0,0,width,height);
  return canvas.toDataURL('image/jpeg',.82);
 }finally{URL.revokeObjectURL(url)}
}

 const rgba=/^rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(raw);
 if(rgba)return '#'+rgba.slice(1,4).map(n=>clamp(Math.round(+n),0,255).toString(16).padStart(2,'0')).join('');
 try{
  const ctx=document.createElement('canvas').getContext('2d');
  ctx.fillStyle='#000000';ctx.fillStyle=raw;
  const out=String(ctx.fillStyle||'');
  if(/^#[0-9a-f]{6}$/i.test(out))return out.toLowerCase();
 }catch{}

}

 ctx.moveTo(x+rr,y);ctx.lineTo(x+w-rr,y);ctx.arcTo(x+w,y,x+w,y+rr,rr);
 ctx.lineTo(x+w,y+h-rr);ctx.arcTo(x+w,y+h,x+w-rr,y+h,rr);
 ctx.lineTo(x+rr,y+h);ctx.arcTo(x,y+h,x,y+h-rr,rr);
 ctx.lineTo(x,y+rr);ctx.arcTo(x,y,x+rr,y,rr);

/* Interpolated geometry for one layer at `t` (ms), matching applyKf() and the
   CSS animation presets the stage renders. Box values stay in stage percent. */
function layerState(l,t){
 const num=(v,d)=>{const n=+v;return Number.isFinite(n)?n:d};

 const animations=timelineAnims(l),kfEvent=animations.find(event=>event.keyframes),k=kfEvent? kfEvent.keyframes:l.kf;
 if(k&&k.length){
  let i=0;while(i<k.length-1&&k[i+1].time<=t)i++;
  const a=k[i],b=k[i+1];
  if(!b||b.time<=a.time){
   st.x=num(a.x,st.x);st.y=num(a.y,st.y);st.w=num(a.w,st.w);st.h=num(a.h,st.h);
   st.opacity=clamp(num(a.opacity,1),0,1);
   st.rot=num(a.rotation,0)+num(l.rotation,0);
   return st;
  }
  const p=easeSmooth(clamp((t-a.time)/(b.time-a.time),0,1));
  st.x=a.x+(num(b.x,a.x)-num(a.x,0))*p;
  st.y=a.y+(num(b.y,a.y)-num(a.y,0))*p;
  st.w=num(a.w,st.w)+(num(b.w,a.w)-num(a.w,st.w))*p;
  st.h=num(a.h,st.h)+(num(b.h,a.h)-num(a.h,st.h))*p;
  const oa=clamp(num(a.opacity,1),0,1),ob=clamp(num(b.opacity,1),0,1);
  st.opacity=oa+(ob-oa)*p;
  st.rot=num(a.rotation,0)+(num(b.rotation,0)-num(a.rotation,0))*p+num(l.rotation,0);
  return st;
 }
 for(const a of animations){
  if(a.keyframes)continue;
  const dur=Math.max(1,num(a.duration,900)),start=num(a.start,0),preset=String(a.preset||'');
  const looping=ANIM_LOOPING.has(preset);
  const p=looping?((((t-start)/dur)%1)+1)%1:clamp((t-start)/dur,0,1);
  if(preset==='fadeIn'){st.opacity=p;st.ty=(1-p)*0.02}
  else if(preset==='zoom')st.scale=1+0.08*easeOutCubic(p);
  else if(preset==='parallax'){st.scale=1.08;st.ty=-0.025*easeOutCubic(p)}
  else if(preset==='pulse')st.opacity=Math.max(0,1-0.65*Math.sin(Math.PI*p));
  else if(preset.startsWith('clip'))st.clip={preset,p:easeOutQuint(p)};

}

/* Clip-path presets from the stylesheet, evaluated as polygons/circles. */
function clipPathFor(ctx,clip,x,y,w,h){
 const p=clip.p,cx=x+w/2,cy=y+h/2;
 const poly=pts=>{ctx.beginPath();pts.forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py));ctx.closePath()};
 const lerpTo=(from,to)=>to.map(([tx,ty])=>[from[0]+(tx-from[0])*p,from[1]+(ty-from[1])*p]);
 switch(clip.preset){
  case 'clipWipeRight': poly([[x,y],[x+w*p,y],[x+w*p,y+h],[x,y+h]]);return;
  case 'clipWipeLeft': poly([[x+w*(1-p),y],[x+w,y],[x+w,y+h],[x+w*(1-p),y+h]]);return;
  case 'clipWipeDown': poly([[x,y],[x+w,y],[x+w,y+h*p],[x,y+h*p]]);return;
  case 'clipWipeUp': poly([[x,y+h*(1-p)],[x+w,y+h*(1-p)],[x+w,y+h],[x,y+h]]);return;
  case 'clipWipeDiag': poly([[x,y],[x+w*p,y],[x+w*p,y+h],[x,y+h]]);return;
  case 'clipCornerIn': poly([[x,y],[x+w*p,y],[x+w*p,y+h*p],[x,y+h*p]]);return;
  case 'clipSplitCenter': poly(lerpTo([cx,cy],[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]));return;
  case 'clipDiamond': poly(lerpTo([cx,cy],[[cx,y],[x+w,cy],[cx,y+h],[x,cy]]));return;
  case 'clipChevron': poly(lerpTo([x,cy],[[x,y],[x+w*.7,y],[x+w,cy],[x+w*.7,y+h],[x,y+h],[x+w*.3,cy]]));return;
  case 'clipArrow': poly(lerpTo([x,cy],[[x,y+h*.3],[x+w*.6,y+h*.3],[x+w*.6,y],[x+w,cy],[x+w*.6,y+h],[x+w*.6,y+h*.7],[x,y+h*.7]]));return;
  default: {
   const diag=Math.hypot(w,h)/Math.SQRT2;
   const iris=(ox,oy,scale)=>{ctx.beginPath();ctx.arc(ox,oy,Math.max(0,diag*scale*p),0,Math.PI*2)};
   if(clip.preset==='clipIris')iris(cx,cy,.75);
   else if(clip.preset==='clipIrisTop')iris(cx,y,1.2);
   else if(clip.preset==='clipIrisBottom')iris(cx,y+h,1.2);
   else poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);
  }
 }
}

function applyTextTransform(text,transform){
 const value=String(text==null?'':text);
 if(transform==='uppercase')return value.toUpperCase();
 if(transform==='lowercase')return value.toLowerCase();
 if(transform==='capitalize')return value.replace(/(^|\s)(\p{Ll})/gu,(m,a,b)=>a+b.toUpperCase());

}

function paintText(ctx,l,x,y,w,h,H){
 const f=l.font||{},fs=Math.max(1,(+f.sizePct||2)/100*H),lh=+f.lineHeight||1.2,ls=(+f.letterSpacingEm||0)*fs;
 const family=String(f.family||'Helvetica Neue').replace(/"/g,'');
 ctx.save();
 roundRectPath(ctx,x,y,w,h,(+l.radius||0)/100*H);
 if(l.bg){ctx.fillStyle=l.bg;ctx.fill()}
 ctx.clip();
 ctx.font=`${f.style||f.fontStyle||'normal'} ${+f.weight||400} ${fs}px "${family}", Helvetica, Arial, sans-serif`;
 try{ctx.letterSpacing=ls+'px'}catch{}
 const raw=applyTextTransform(l.text,f.transform);
 const lines=[];
 if(l.nowrap)lines.push(...raw.split('\n'));
 else raw.split('\n').forEach(para=>{
  const words=para.split(/\s+/).filter(Boolean);
  if(!words.length){lines.push('');return}
  let cur='';
  for(const word of words){
   const next=cur?cur+' '+word:word;
   if(!cur||ctx.measureText(next).width<=w)cur=next;
   else{lines.push(cur);cur=word}
  }
  lines.push(cur);
 });

 ctx.fillStyle=l.color||TH.ink;
 ctx.textAlign=align;
 ctx.textBaseline='middle';
 const top=l.valign==='top'?y:l.valign==='bottom'?y+h-blockH:y+h/2-blockH/2;
 let ty=top+fs*lh/2;
 for(const line of lines){
  if(line)ctx.fillText(align==='center'?line.trim():line,ax,ty,w);
  ty+=fs*lh;

}

/* ---------- menus, venue offers and other dropped content ----------
   A menu line is plain text, so the layer stays editable: `Name | Description
   | £Price`, `#` for a section heading. The renderer owns the typography —
   dish in the brand's display face, price set flush right, description in the
   body face — and scales the whole block down to the box it was dropped on,
   so a dish never arrives unstyled or spilling out of its layer. */
function parseMenuRows(value){
 const out=[];
 String(value==null?'':value).split('\n').forEach(raw=>{
  const line=raw.trim();
  if(!line)return;
  if(line.startsWith('#')){out.push({section:line.replace(/^#+\s*/,'')});return}
  const parts=line.split(/\s*\|\s*/);
  let name=parts[0]||'',description='',price='';
  if(parts.length===1){/* name only */}
  else if(parts.length===2){
   if(/^[£$€]?\s*\d/.test(parts[1]))price=parts[1];
   else description=parts[1];
  }else{
   const last=parts[parts.length-1];
   if(/^[£$€]?\s*\d/.test(last)||/^(?:free|poa|on request)$/i.test(last)){price=last;description=parts.slice(1,-1).join(' | ')}
   else description=parts.slice(1).join(' | ');
  }
  out.push({name:name.trim(),description:description.trim(),price:price.trim()});
 });
 return out;
}
/* The preview side of paintMenuBlock: same rows, same emphasis, in CSS. */
function menuBlockHTML(l){
 const rows=parseMenuRows(l.text);
 const bodyFamily=String(BF.body||(l.font&&l.font.family)||'inherit');
 const block=rows.map(row=>{
  if(row.section)return `<div class="mb-sec">${esc(row.section)}</div>`;
  const price=row.price?`<span class="mb-p">${esc(row.price)}</span>`:'';
  const description=row.description
   ?`<div class="mb-d" style="font-family:${esc(bodyFamily)}">${esc(row.description)}</div>`:'';
  return `<div class="mb-item"><div class="mb-row"><span class="mb-n">${esc(row.name)}</span>${price}</div>${description}</div>`;
 }).join('');
 return `<div class="mb${l.format==='offer'?' mb-offer':''}">${block}</div>`;
}
function fitMenuLayer(el){
 const inner=el.firstElementChild;
 if(!inner)return;
 const base=parseFloat(el.dataset.menu)||2.2;
 const boxH=el.clientHeight,boxW=el.clientWidth;
 if(!boxH||!boxW)return;
 const shrink=()=>{
  let pct=parseFloat(el.style.fontSize)||base;
  el.classList.remove('mb-tight');
  for(let pass=0;pass<5;pass+=1){
   const contentH=inner.scrollHeight,contentW=inner.scrollWidth;
   if(contentH<=boxH+1&&contentW<=boxW+1)break;
   const ratio=Math.min(contentH>boxH+1?boxH/contentH:1,contentW>boxW+1?boxW/contentW:1);
   pct=Math.max(.25,pct*Math.min(ratio,.98));
   el.style.fontSize=pct+'cqh';
  }
  return pct;
 };
 el.style.fontSize=base+'cqh';
 let pct=shrink();
 // Same trade as the canvas painter: once the block is this small the
 // descriptions would print at two pixels high, so they are dropped.
 if(pct<base*.55){
  el.classList.add('mb-tight');
  el.style.fontSize=base+'cqh';
  pct=shrink();
  el.classList.add('mb-tight');
 }
}
function wrapCanvasText(ctx,value,maxWidth){
 const words=String(value||'').split(/\s+/).filter(Boolean),lines=[];
 if(!words.length)return lines;
 let line='';
 words.forEach(word=>{
  const next=line?line+' '+word:word;
  if(!line||ctx.measureText(next).width<=maxWidth)line=next;
  else{lines.push(line);line=word}
 });
 if(line)lines.push(line);
 return lines;
}
function paintMenuBlock(ctx,l,x,y,w,h,H){
 const rows=parseMenuRows(l.text);
 if(!rows.length)return;
 // `font.family` is a CSS stack (`"Caprasimo","Helvetica Neue",Arial`).
 // Quoting it again makes the whole assignment invalid and the canvas falls
 // back to 10px sans-serif, so the stack goes in as it is.
 const stack=value=>{const raw=String(value||'').trim();return raw?`${raw}, Georgia, serif`:'Georgia, serif'};
 const f=l.font||{},family=stack(f.family||BF.display);
 const bodyFamily=stack(BF.body||f.family);
 const ink=l.color||TH.ink;
 const accent=TH.accent||ink;
 const base=Math.max(1,(+f.sizePct||2.2)/100*H);
 const isOffer=l.format==='offer';
 const pad=Math.min(w*.035,h*.06);
 const availW=Math.max(8,w-pad*2),availH=Math.max(8,h-pad*2);
 const lineH=+f.lineHeight||1.18;
 const layout=(scale,withDescriptions=true)=>{
  const nameSize=base*scale,descSize=nameSize*(isOffer?.62:.56),secSize=nameSize*.74;
  const items=[];
  let total=0;
  rows.forEach((row,index)=>{
   if(row.section){
    const top=index===0?0:nameSize*.72,headH=secSize*1.5;
    items.push({row,kind:'section',top,headH,nameSize,descSize,secSize,lines:[]});
    total+=top+headH+nameSize*.28;
    return;
   }
   const top=index===0||rows[index-1]?.section?0:nameSize*.62;
   ctx.font=`${+f.weight||600} ${nameSize}px ${family}`;
   const priceW=row.price?ctx.measureText(row.price).width:0;
   const nameMax=Math.max(20,availW-priceW-(row.price?nameSize*.7:0));
   const nameLines=wrapCanvasText(ctx,row.name,nameMax);
   ctx.font=`400 ${descSize}px ${bodyFamily}`;
   const descLines=withDescriptions?wrapCanvasText(ctx,row.description,availW):[];
   const nameH=nameLines.length*nameSize*lineH,descH=descLines.length*descSize*1.34;
   items.push({row,kind:'item',top,nameH,descH,nameSize,descSize,secSize,nameLines,descLines,priceW});
   total+=top+nameH+descH;
  });

 let plan=layout(1,true);
 if(plan.total>availH&&plan.total>0)plan=layout(Math.max(.05,availH/plan.total),true);

 // stops fitting: below this size the descriptions are dropped rather than
 // printed at two pixels high.
 if(plan.nameSize<base*.55){
  const tight=layout(1,false);

  cursor+=entry.top;
  if(entry.kind==='section'){
   const size=entry.secSize;
   ctx.font=`700 ${size}px ${family}`;
   try{ctx.letterSpacing=(size*.07)+'px'}catch{}
   ctx.fillStyle=accent;
   ctx.textAlign='left';
   ctx.fillText(applyTextTransform(entry.row.section||'','uppercase'),x+pad,cursor+size*.72,availW);
   try{ctx.letterSpacing='0px'}catch{}
   ctx.fillStyle=rgba(accent,.3);
   ctx.fillRect(x+pad,cursor+size*1.28,availW,Math.max(1,H*.0016));
   cursor+=entry.headH;
   return;
  }
  const nameSize=entry.nameSize,descSize=entry.descSize;
  ctx.font=`${+f.weight||600} ${nameSize}px ${family}`;
  try{ctx.letterSpacing=((+f.letterSpacingEm||0)*nameSize)+'px'}catch{}
  ctx.fillStyle=ink;
  ctx.textAlign='left';
  let lineY=cursor+nameSize*lineH/2;
  entry.nameLines.forEach(line=>{ctx.fillText(line,x+pad,lineY,availW);lineY+=nameSize*lineH});
  try{ctx.letterSpacing='0px'}catch{}
  if(entry.row.price){
   ctx.font=`700 ${nameSize*.92}px ${family}`;
   ctx.fillStyle=isOffer?accent:ink;
   ctx.textAlign='right';
   ctx.fillText(entry.row.price,x+w-pad,cursor+nameSize*lineH/2,availW);
  }
  if(entry.descLines.length){
   ctx.font=`400 ${descSize}px ${bodyFamily}`;
   ctx.fillStyle=rgba(ink,.68);
   ctx.textAlign='left';
   let dy=cursor+entry.nameH+descSize*.72;
   entry.descLines.forEach(line=>{ctx.fillText(line,x+pad,dy,availW);dy+=descSize*1.34});
  }
  cursor+=entry.nameH+entry.descH;
 });
 if(isOffer){
  ctx.fillStyle=rgba(accent,.55);
  ctx.fillRect(x+pad,cursor+Math.min(pad*.4,H*.006),availW,Math.max(1,H*.0018));
 }
 ctx.restore();
}

const VIDEO_CACHE=new Map();
function ensureVideo(src){
 if(VIDEO_CACHE.has(src))return VIDEO_CACHE.get(src);
 const v=document.createElement('video');
 v.preload='auto';v.muted=true;v.playsInline=true;
 v.src=src;
 const ready=new Promise((resolve,reject)=>{
  let settled=false;
  const ok=()=>{if(settled)return;settled=true;resolve(v)};
  const bad=()=>{if(settled)return;settled=true;reject(new Error('Could not load the video layer.'))};
  v.addEventListener('loadeddata',ok,{once:true});
  v.addEventListener('error',bad,{once:true});
  setTimeout(bad,12000);
 });
 VIDEO_CACHE.set(src,ready);
 return ready;
}
function seekVideo(v,time){
 return new Promise(resolve=>{
  let done=false;
  const finish=()=>{if(done)return;done=true;v.removeEventListener('seeked',finish);clearTimeout(timer);resolve()};
  const timer=setTimeout(finish,700);
  v.addEventListener('seeked',finish,{once:true});
  try{v.currentTime=time}catch{finish()}
 });
}
async function paintVideoLayer(ctx,src,fit,x,y,w,h,t){
 let v;
 try{v=await ensureVideo(src)}catch{return false}
 const duration=Number.isFinite(v.duration)&&v.duration>0?v.duration:0;
 if(duration){
  const want=((t/1000)%duration+duration)%duration;
  if(Math.abs(v.currentTime-want)>.05)await seekVideo(v,want);
 }
 const nw=v.videoWidth||1,nh=v.videoHeight||1;
 try{
  if(fit==='contain'){
   const s=Math.min(w/nw,h/nh);
   ctx.drawImage(v,x+(w-nw*s)/2,y+(h-nh*s)/2,nw*s,nh*s);
  }else if(fit==='fill'){
   ctx.drawImage(v,x,y,w,h);
  }else{
   const s=Math.max(w/nw,h/nh),iw=nw*s,ih=nh*s;
   ctx.drawImage(v,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
  }
 }catch{return false}

}

async function paintImageLayer(ctx,l,x,y,w,h){
 const src=l.src?absUrl(l.src):'';
 if(!src){
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,TH.ink);g.addColorStop(1,TH.accent);
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  return;
 }
 let im;
 try{im=await loadImg(src)}catch{return}
 const nw=im.naturalWidth||im.width||1,nh=im.naturalHeight||im.height||1;
 if(l.fit==='contain'){
  const s=Math.min(w/nw,h/nh);
  ctx.drawImage(im,x+(w-nw*s)/2,y+(h-nh*s)/2,nw*s,nh*s);
  return;
 }
 if(l.fit==='fill'){ctx.drawImage(im,x,y,w,h);return}
 const s=Math.max(w/nw,h/nh),iw=nw*s,ih=nh*s;

 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 ctx.drawImage(im,x+(w-iw)*fx,y+(h-ih)*fy,iw,ih);
 ctx.restore();
}

async function paintLogoLayer(ctx,l,x,y,w,h,H){
 const src=l.which?logoSrc(l.which,l.tone):'';
 if(src){
  let im;
  try{im=await loadImg(src)}catch{im=null}
  if(im){
   const nw=im.naturalWidth||im.width||1,nh=im.naturalHeight||im.height||1;
   const s=Math.min(w/nw,h/nh),iw=nw*s,ih=nh*s;
   const left=(+l.x||0)<20,right=(+l.x||0)+(+l.w||0)>80;
   ctx.drawImage(im,left?x:right?x+w-iw:x+(w-iw)/2,y+(h-ih)/2,iw,ih);
   return;
  }

 const word=String((B&&(B.wordmark||B.name))||'Brand').toUpperCase();
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 ctx.fillStyle=toneHex(l.tone);
 ctx.font=`700 ${Math.max(1,h*.5)}px "${String(BF.display||'Georgia').replace(/"/g,'')}", Georgia, serif`;
 ctx.textBaseline='middle';
 const left=(+l.x||0)<20,right=(+l.x||0)+(+l.w||0)>80;
 ctx.textAlign=left?'left':right?'right':'center';
 ctx.fillText(word,left?x:right?x+w:x+w/2,y+h/2);

}

function traceLayerPath(ctx,l,x,y,w,h,H){
 if(l.shape==='circle'){
  ctx.beginPath();
  ctx.ellipse(x+w/2,y+h/2,Math.max(.1,w/2),Math.max(.1,h/2),0,0,Math.PI*2);
  ctx.closePath();

async function paintLayer(ctx,l,W,H,t){

 const w=Math.max(.5,st.w/100*W),h=Math.max(.5,st.h/100*H);
 const alpha=clamp(st.opacity*(l.opacity==null?1:+l.opacity),0,1);

  const cx=x+w/2,cy=y+h/2;

  ctx.translate(cx,cy+st.ty*H);ctx.scale(st.scale,st.scale);ctx.translate(-cx,-cy);

 if(l.type==='fill'){
  ctx.fillStyle=l.color||EXPORT_BG;ctx.fillRect(x,y,w,h);

  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,l.from||TH.ink);g.addColorStop(1,l.to||TH.accent);
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);

  ctx.save();

  let painted=false;
  if(l.videoUrl)painted=await paintVideoLayer(ctx,l.videoUrl,l.fit,x,y,w,h,t);
  if(!painted&&l.src)await paintImageLayer(ctx,l,x,y,w,h);

  let painted=false;
  if(l.videoUrl)painted=await paintVideoLayer(ctx,l.videoUrl,l.fit,x,y,w,h,t);
  if(!painted)await paintImageLayer(ctx,l,x,y,w,h);
  ctx.restore();
 }else if(l.type==='logo'){
  await paintLogoLayer(ctx,l,x,y,w,h,H);
 }else if(l.type==='text'){
  if(l.format==='menu-item'||l.format==='menu-list'||l.format==='offer')paintMenuBlock(ctx,l,x,y,w,h,H);
  else paintText(ctx,l,x,y,w,h,H);
 }
 ctx.restore();
}

/* Paints the whole design at `time` (ms). `only` limits the render to layer
   ids (segment export) and `background:null` keeps it transparent. */
async function paintScene(ctx,W,H,opts){
 const o=opts||{},t=o.time==null?DUR:o.time,only=o.only||null;
 if(o.background!==null){ctx.save();ctx.fillStyle=o.background||EXPORT_BG;ctx.fillRect(0,0,W,H);ctx.restore()}
 const layers=scene
  .filter(l=>l&&(!only||only.includes(l.id))&&(only||!l.hidden))
  .slice().sort((a,b)=>(a.z||0)-(b.z||0));
 for(const l of layers)await paintLayer(ctx,l,W,H,t);
}

async function frameCanvas(time,W,H){
 const cv=document.createElement('canvas');
 cv.width=Math.max(1,Math.round(W));cv.height=Math.max(1,Math.round(H));
 const ctx=cv.getContext('2d');
 await paintScene(ctx,cv.width,cv.height,{time});
 return cv;
}

/* ==========================================================================
   Save the current design as a brand template
   ========================================================================== */
const ART_CAP=1400;

/* A layer that already points at a server file keeps that URL so the server can
   copy it into the template; everything else (tinted logos, gradient fills) is
   baked into a PNG so the template looks exactly like the stage. */
async function layerArtwork(l,force){
 if(!force&&l.type==='image'&&l.src&&!/^data:/i.test(String(l.src)))return String(l.src);
 const scale=Math.min(1,ART_CAP/FMT.w);
 const W=Math.max(2,Math.round(FMT.w*scale)),H=Math.max(2,Math.round(FMT.h*scale));
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;
 await paintScene(cv.getContext('2d'),W,H,{time:DUR,only:[l.id],background:null});
 // Crop to the layer box so the baked PNG drops straight back into the same
 // rectangle when the template is reopened.
 const x0=clamp(Math.floor(W*(l.x||0)/100),0,W-2),y0=clamp(Math.floor(H*(l.y||0)/100),0,H-2);
 const x1=clamp(Math.ceil(W*((l.x||0)+(l.w||0))/100),x0+2,W),y1=clamp(Math.ceil(H*((l.y||0)+(l.h||0))/100),y0+2,H);
 const cw=x1-x0,ch=y1-y0;
 if(cw>=W&&ch>=H)return cv.toDataURL('image/png');
 const out=document.createElement('canvas');out.width=cw;out.height=ch;
 out.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,cw,ch);
 return out.toDataURL('image/png');
}

/* The server copies brand-pack and import files into the saved template; any
  other address (a repository project asset, a remote link) is baked instead so
  the template stays self-contained. */
const localisePath=/^\/(?:api\/brand-packs|data\/imports)\//;
function sameOriginPath(src){
 try{
  const url=new URL(String(src||''),location.href);
  if(url.origin===location.origin)return url.pathname;
  // Saved templates written on localhost keep an absolute URL even when the
  // dev server moves to another port. Treat those paths as local.
  if(url.hostname===location.hostname||/^(localhost|127\.0\.0\.1|\[::1\])$/i.test(url.hostname))return url.pathname;
  return '';
 }catch{return ''}
}
function templateArtwork(l){
 const src=String((l&&l.src)||'');
 if(!src||/^data:/i.test(src))return layerArtwork(l);
 const path=sameOriginPath(src);
 if(!path)return src;
 return localisePath.test(path)?path:layerArtwork(l);
}

/* Inverse of compositionToScene(): turns the live stage scene into the
   composition document LayerStudio and the brand packs already understand. */
async function compositionFromScene(name){
 const title=String(name||designName());
 const ordered=scene.slice().sort((a,b)=>(a.z||0)-(b.z||0));
 const layers=[];
 for(let i=0;i<ordered.length;i++){
  const l=ordered[i];
  const rotationOffset=+(l.rotation||0);
  const keyframes=layerKeyframes(l);
  const keyed=Array.isArray(keyframes)&&keyframes.length>0;
  const kRotation=k=>{
   const next=(+k.rotation||0)+rotationOffset;
   return Number.isFinite(+k.rotation)||rotationOffset?{rotation:+next.toFixed(2)}:{};
  };
  const base={
   id:String(l.id||`layer-${i+1}`),
   name:String(l.name||`Layer ${i+1}`),
   x:+clamp(+l.x||0,0,100).toFixed(2),
   y:+clamp(+l.y||0,0,100).toFixed(2),
   w:+clamp(l.w==null?100:+l.w,.1,100).toFixed(2),
   h:+clamp(l.h==null?10:+l.h,.1,100).toFixed(2),
   z:+(+l.z||i),
   opacity:+clamp(l.opacity==null?1:+l.opacity,0,1).toFixed(3),
   visible:!l.hidden,
   ...(l.assetId?{assetId:String(l.assetId)}:{}),
   rotation:keyed?0:+rotationOffset.toFixed(2),
   shape:l.shape==='circle'?'circle':'rect',
   ...(l.radius?{radius:+clamp(+l.radius||0,0,50).toFixed(2)}:{}),
  };
  if(l.type==='text'){
   const f=l.font||{};
   layers.push({...base,type:'text',text:String(l.text==null?'':l.text),color:l.color||TH.ink,
    align:['center','right'].includes(l.align)?l.align:'left',
    verticalAlign:['top','middle','bottom'].includes(l.valign)?l.valign:'middle',
    ...(['menu-item','menu-list','offer'].includes(l.format)?{format:l.format}:{}),
    ...(l.bg?{bg:l.bg,radius:+clamp(+l.radius||0,0,50).toFixed(2)}:{}),
    font:{family:f.family||BF.body,weight:+f.weight||400,style:f.style||'normal',
     sizePct:+clamp(+f.sizePct||2,.4,40).toFixed(2),
     lineHeight:+f.lineHeight||1.2,
     letterSpacingEm:+f.letterSpacingEm||0,
     transform:f.transform||'none'}});
  }else if(l.type==='fill'){
   layers.push({...base,type:'fill',color:l.color||TH.ink});
  }else if(l.type==='gradient'){
   layers.push({...base,type:'gradient',from:l.from||TH.ink,to:l.to||TH.accent});
  }else if(l.type==='logo'){
   layers.push({...base,type:'logo',which:l.which==='mark'?'mark':'wordmark',tone:['white','ink','accent'].includes(l.tone)?l.tone:'white'});
  }else if(l.type==='shape'){
   const url=l.src||l.videoUrl?await templateArtwork(l):'';
   layers.push({...base,type:'shape',color:l.color||TH.ink,fit:l.fit==='contain'||l.fit==='fill'?l.fit:'cover',
    ...(url?{url}:{}),...(l.videoUrl?{videoUrl:l.videoUrl}:{})});
  }else{
   layers.push({...base,type:'image',url:await templateArtwork(l),fit:l.fit==='contain'||l.fit==='fill'?l.fit:'cover',
    ...(l.videoUrl?{videoUrl:l.videoUrl}:{})});
  }
  const animations=timelineAnims(l).map(event=>({
   id:String(event.id||newTimelineId()),preset:event.preset,start:+event.start||0,duration:+event.duration||900,
   ...(Array.isArray(event.keyframes)?{keyframes:clone(event.keyframes).map(k=>({...k,...kRotation(k)}))}:{})
  }));
  if(animations.length===1)layers[layers.length-1].animation=animations[0];
  else if(animations.length>1)layers[layers.length-1].animations=animations;
  const legacyKeys=layerKeyframes(l);
  if(Array.isArray(legacyKeys)&&legacyKeys.length>1&&!animations.some(event=>event.keyframes)){
   layers[layers.length-1].keyframes=legacyKeys.slice().sort((a,b)=>a.time-b.time).map(k=>({
    time:+k.time||0,x:+k.x||0,y:+k.y||0,w:+k.w||0,h:+k.h||0,
    ...kRotation(k),
    opacity:+clamp(k.opacity==null?1:+k.opacity,0,1).toFixed(3)}));
  }
 }
 const brand=B||{};
 const kit=(window.StudioBrand&&StudioBrand.brandKitFor)?StudioBrand.brandKitFor(brand):null;
 const now=new Date().toISOString();
 return {
  version:3,
  id:`agent-studio-${slugText(title)}`,
  name:title,
  width:FMT.w,
  height:FMT.h,
  duration:DUR,
  defaultLocale:'en',
  referenceLayerId:null,
  characters:[],
  variables:[],
  formats:[{id:'master',isMaster:true,channel:'print',label:'Master',width:FMT.w,height:FMT.h,layerOverrides:{},variableValues:{}}],
  activeFormatId:'master',
  brandKit:kit,
  brandKitId:brand.brandKitId||null,
  guardrails:{enabled:false,block:false},
  showSafeZones:false,
  layers,
  meta:{
   source:'agent-studio',
   schema:'agent-studio/composition/1',
   packId:P&&P.id,packName:P&&P.name,
   brandId:brand.id,brandName:brand.name,
   templateId:FMT.saved?String(FMT.id).replace(/^saved:/,''):FMT.id,
   formatLabel:FMT.n,
   createdAt:now,updatedAt:now,
   agentScene:clone(scene),
  },
 };
}

async function apiSend(url,method,body){
 const res=await fetch(url,{
  method:method||'POST',
  headers:{'Content-Type':'application/json'},
  body:body===undefined?undefined:JSON.stringify(body),
 });
 const data=await res.json().catch(()=>null);
 if(!res.ok)throw new Error((data&&data.error)||`${method||'POST'} ${url} failed (${res.status}).`);
 return data||{};
}

/* Save the composition itself (not a template snapshot) to the backend.
   Imports update in place; repository compositions become an editable copy on
   the first save; published templates are opened into a copy first; a plain
   brand-built scene becomes a new import project. */
async function persistComposition(){
 if(SAVE.saving)return false;
 if(demo){toast('The offline demo has no backend to save into.',true);return false}
 const btn=$('#saveComp');
 if(btn)btn.disabled=true;
 SAVE.saving=true;
 try{
  const name=SAVE.name||designName();
  const composition=await compositionFromScene(name);
  let result=null;
  if(SAVE.projectId){
   result=await apiSend(`${API}/imports/${encodeURIComponent(SAVE.projectId)}/composition.json`,'PUT',{composition,meta:{name}});
   SAVE.name=(result.project&&result.project.name)||name;
  }else if(SAVE.repositorySource){
   const source=SAVE.repositorySource;
   result=await apiSend(`${API}/imports/copy`,'POST',{
    sourceProjectId:source.projectId,
    sourceCompositionId:source.compositionId,
    composition,
   });
   SAVE.projectId=(result.project&&result.project.id)||'';
   SAVE.repositorySource=null;
   SAVE.name=(result.project&&result.project.name)||name;
  }else if(SAVE.template){
   const source=SAVE.template;
   const base=`${API}/brand-packs/${encodeURIComponent(source.packId)}/templates/${encodeURIComponent(source.brandId)}/${encodeURIComponent(source.templateId)}`;
   const opened=await apiSend(`${base}/open`,'POST',{name});
   const projectId=(opened.project&&opened.project.id)||'';
   if(!projectId)throw new Error('The template could not be opened as a project.');
   SAVE.projectId=projectId;
   // The open endpoint copies the template's files into the new import and
   // rewrites URLs. Keep the user's current edits, but point their image
   // references at the copied files so deleting the template cannot break them.
   const copied=new Map(((opened.composition&&opened.composition.layers)||[]).map(layer=>[String(layer.id),layer]));
   for(const layer of composition.layers||[]){
    const target=copied.get(String(layer.id));if(!target)continue;
    const assetRef=typeof layer.url==='string'&&/^\/(?:api\/brand-packs|data\/imports)\//.test(layer.url);
    if(assetRef&&target.url)layer.url=target.url;
    if(assetRef&&Array.isArray(target.frames)&&target.frames.length)layer.frames=target.frames;
    if(assetRef&&target.videoUrl)layer.videoUrl=target.videoUrl;
   }
   SAVE.template=null;
   result=await apiSend(`${API}/imports/${encodeURIComponent(projectId)}/composition.json`,'PUT',{composition,meta:{name}});
   SAVE.name=(opened.project&&opened.project.name)||name;
  }else{
   result=await apiSend(`${API}/compositions`,'POST',{name,composition});
   SAVE.projectId=(result.project&&result.project.id)||'';
   SAVE.name=(result.project&&result.project.name)||name;
  }
  saveScene();
  if($('#status'))$('#status').textContent=`${SAVE.name} · saved`;
  toast(`Saved “${SAVE.name}” to the studio backend`);
  say('agent',`Saved <b>${esc(SAVE.name)}</b> to the studio backend.${SAVE.projectId?` Project <code>${esc(SAVE.projectId)}</code>.`:''}`);
  return true;
 }catch(error){
  toast(error&&error.message?error.message:String(error),true);
  console.error(error);
  return false;
 }finally{
  SAVE.saving=false;
  if(btn)btn.disabled=false;
 }
}

/* ---------- JSON composition / animation editor ---------- */
function applyCompositionDocument(data){
 const composition=compositionPayload(data);
 const next=importedScene(composition);
 if(!next.length)throw new Error('That composition has no layers to apply.');
 stopP();hist.push(clone(scene));
 const w=Math.max(64,Math.round(+(composition.width||FMT.w)));
 const h=Math.max(64,Math.round(+(composition.height||FMT.h)));
 FMT={...FMT,w,h,n:String(composition.name||FMT.n)};
 setDuration(+(composition.duration)||DUR);
 T=next.some(layer=>timelineAnims(layer).length)?0:DUR;
 timelineSelection=null;clearLayerSelection();AS.savedActive=null;
 fitStage();sizeProbe();
 scene=next;
 if(composition.name)SAVE.name=String(composition.name);
 chrome();render();layers();assets();remember();saveScene();
 if($('#status'))$('#status').textContent=`${FMT.n} · JSON applied`;
 return next.length;
}

function animationSegmentEvents(track){
 const events=[];
 const base=(track&&track.box)||{};
 const bx=(+base.x||0)*100,by=(+base.y||0)*100;
 const bw=Math.max(.1,(+base.w||1)*100),bh=Math.max(.1,(+base.h||1)*100);
 const cx=bx+bw/2,cy=by+bh/2;
 for(const segment of (track&&track.segments)||[]){
  const frames=Array.isArray(segment.frames)?segment.frames:[];
  if(!frames.length)continue;
  const start=Math.max(0,Math.round(+segment.start||0));
  const keys=frames.map(frame=>{
   const s=Math.max(.01,+frame.s||1);
   const sx=Math.max(.01,+frame.sx||1),sy=Math.max(.01,+frame.sy||1);
   const w=Math.max(.1,bw*sx*s),h=Math.max(.1,bh*sy*s);
   return {
    time:Math.max(0,Math.round(start+(+frame.t||0))),
    x:+(cx-w/2+(+frame.dx||0)*100).toFixed(2),
    y:+(cy-h/2+(+frame.dy||0)*100).toFixed(2),
    w:+w.toFixed(2),h:+h.toFixed(2),
    opacity:+(frame.a==null?1:clamp(+frame.a,0,1)).toFixed(3),
   };
  }).sort((a,b)=>a.time-b.time);
  if(!keys.length)continue;
  events.push({
   id:newTimelineId(),
   preset:String(segment.preset||'keyframes'),
   start:keys[0].time,
   duration:Math.max(1,keys[keys.length-1].time-keys[0].time),
   keyframes:keys,
  });
 }
 return events;
}

function animationDocumentPayload(data){
 let value=data;
 if(value&&value.animation&&typeof value.animation==='object')value=value.animation;
 if(!value||typeof value!=='object'||!Array.isArray(value.tracks)){
  throw new Error('That is not an exported animation JSON — it has no tracks array.');
 }
 return value;
}

function applyAnimationDocument(data,opts){
 const payload=animationDocumentPayload(data);
 const replace=!opts||opts.replace!==false;
 const byId=new Map(scene.map(layer=>[String(layer.id),layer]));
 const byName=new Map(scene.map(layer=>[String(layer.name||'').trim().toLowerCase(),layer]));
 const updates=[];let skipped=0;
 for(const track of payload.tracks||[]){
  if(!track||typeof track!=='object')continue;
  const layer=byId.get(String(track.layerId||''))||byName.get(String(track.layerName||'').trim().toLowerCase());
  if(!layer){skipped+=1;continue}
  let events=[];
  if(track.event&&typeof track.event==='object'){
   const event=clone(track.event);
   event.id=event.id&&!scene.some(other=>other!==layer&&timelineAnims(other).some(item=>item.id===event.id))?event.id:newTimelineId();
   if(Array.isArray(event.keyframes))event.keyframes=event.keyframes.map(key=>({...key,time:Math.max(0,+key.time||0)}));
   events=[event];
  }else{
   events=animationSegmentEvents(track);
  }
  if(events.length)updates.push({layer,events});
 }
 if(!updates.length)throw new Error('No layers in the current scene match that animation.');
 stopP();hist.push(clone(scene));
 let maxTime=0,eventCount=0;
 for(const{layer,events}of updates){
  eventCount+=events.length;
  if(replace){
   layer.anims=events;
   delete layer.anim;delete layer.kf;
  }else{
   const list=editableTimelineAnims(layer);
   list.push(...events);
  }
  for(const event of events){
   maxTime=Math.max(maxTime,(+event.start||0)+(+event.duration||0));
   if(Array.isArray(event.keyframes))for(const key of event.keyframes)maxTime=Math.max(maxTime,+key.time||0);
  }
 }
 const requested=+payload.duration;
 if(Number.isFinite(requested)&&requested>0)setDuration(Math.max(requested,maxTime));
 else if(maxTime>DUR)setDuration(maxTime);
 timelineSelection=null;T=0;render();layers();tl();seek(0);saveScene();
 return {layers:updates.length,events:eventCount,skipped};
}

async function openJsonEditor(kind){
 let active=kind==='animation'?'animation':'composition';
 const drafts={};
 const body=`<div class="json-editor">
  <div class="json-tabs" role="tablist" aria-label="JSON document type">
   <button type="button" role="tab" data-json-tab="composition" aria-selected="${active==='composition'}">Composition</button>
   <button type="button" role="tab" data-json-tab="animation" aria-selected="${active==='animation'}">Animation</button>
  </div>
  <div class="json-tools">
   <label class="ed-upload">Upload JSON<input type="file" data-json-file accept=".json,application/json" hidden></label>
   <button type="button" data-json-current>Load current</button>
   <button type="button" data-json-format>Format</button>
   <span class="json-status" data-json-status></span>
  </div>
  <textarea id="jsonText" class="json-text" spellcheck="false" aria-label="JSON document"></textarea>
  <div class="json-foot"><label data-json-replace-wrap${active==='animation'?'':' hidden'}><input type="checkbox" id="jsonReplace" checked> Replace animation on matched layers</label></div>
  <p class="note">Paste or upload an exported composition/animation JSON, or edit the current document. <b>Save JSON</b> applies it to the canvas and timeline.</p>
 </div>`;
 openDialog({
  title:'Edit JSON',
  body,
  actions:[
   {label:'Cancel',value:null},
   {label:'Save JSON',primary:true,busy:'Applying…',run:async body=>{
    const text=body.querySelector('#jsonText').value.trim();
    if(!text)throw new Error('Paste or upload a JSON document first.');
    let data;
    try{data=JSON.parse(text)}catch{throw new Error('That JSON could not be parsed.')}
    if(active==='composition'){
     if(data&&(Array.isArray(data.tracks)||data.schema&&String(data.schema).includes('animation'))){
      throw new Error('That is an animation JSON — open the Animation tab.');
     }
     const count=applyCompositionDocument(data);
     toast(`Composition JSON applied — ${count} layer${count===1?'':'s'}.`);
    }else{
     if(data&&(Array.isArray(data.layers)||data.composition&&Array.isArray(data.composition.layers))){
      throw new Error('That is a composition JSON — open the Composition tab.');
     }
     const result=applyAnimationDocument(data,{replace:body.querySelector('#jsonReplace').checked});
     toast(`Animation imported — ${result.layers} layer${result.layers===1?'':'s'}, ${result.events} event${result.events===1?'':'s'}${result.skipped?` · ${result.skipped} skipped`:''}.`);
    }
    return {ok:true};
   }},
  ],
  onMount:body=>{
   const q=selector=>body.querySelector(selector);
   const textarea=q('#jsonText'),status=q('[data-json-status]'),replaceWrap=q('[data-json-replace-wrap]');
   const tabs=[...body.querySelectorAll('[data-json-tab]')];
   const currentJson=async next=>{
    if(next==='animation')return JSON.stringify(animationPayload(),null,2);
    return JSON.stringify(await compositionFromScene(designName()),null,2);
   };
   const markTab=()=>tabs.forEach(button=>button.setAttribute('aria-selected',String(button.dataset.jsonTab===active)));
   let loadToken=0;
   const setTab=async next=>{
    const token=++loadToken;
    active=next;markTab();replaceWrap.hidden=active!=='animation';
    if(drafts[active]!=null){textarea.value=drafts[active];status.textContent='Draft restored.';return}
    status.textContent='Loading current JSON…';
    try{
     const value=await currentJson(active);
     if(token!==loadToken)return;
     textarea.value=value;drafts[active]=value;status.textContent='Current JSON loaded.';
    }catch(error){if(token===loadToken)status.textContent=`Could not load current JSON: ${error.message}`}
   };
   tabs.forEach(button=>button.addEventListener('click',()=>setTab(button.dataset.jsonTab)));
   textarea.addEventListener('input',()=>{loadToken++;drafts[active]=textarea.value;status.textContent='Edited';});
   q('[data-json-current]').addEventListener('click',()=>{drafts[active]=null;setTab(active)});
   q('[data-json-format]').addEventListener('click',()=>{
    try{loadToken++;const parsed=JSON.parse(textarea.value);textarea.value=JSON.stringify(parsed,null,2);drafts[active]=textarea.value;status.textContent='Formatted.'}

     loadToken++;

     try{parsed=JSON.parse(text)}catch{}
     let next=active;
     if(parsed&&(Array.isArray(parsed.tracks)||parsed.schema&&String(parsed.schema).includes('animation')))next='animation';
     else if(parsed&&(Array.isArray(parsed.layers)||parsed.composition&&Array.isArray(parsed.composition.layers)))next='composition';
     if(next!==active){active=next;markTab();replaceWrap.hidden=active!=='animation'}
     textarea.value=text;drafts[active]=text;status.textContent=`Loaded ${file.name}.`;
    }catch(error){status.textContent=`Could not read file: ${error.message}`}
    finally{fileInput.value=''}
   });
   setTab(active);
  },
 });
}

/* ---------- GIF89a writer (global palette + LZW) ---------- */
const GIF_CLEAR=256,GIF_END=257;
const gifDictionary=new Uint16Array(4096*256);
function gifResetDictionary(){
 gifDictionary.fill(0xffff);
}
function gifLzw(indices){
 let nextCode=258,codeSize=9;
 const clearCode=GIF_CLEAR,endCode=GIF_END;
 const bytes=new Uint8Array(indices.length*2+16);
 let byteLength=0,buffer=0,bitCount=0;
 const writeCode=code=>{
  buffer|=code<<bitCount;bitCount+=codeSize;
  while(bitCount>=8){bytes[byteLength++]=buffer&255;buffer>>>=8;bitCount-=8}
 };
 gifResetDictionary();
 writeCode(clearCode);
 if(!indices.length){
  writeCode(endCode);
 }else{
  let prefix=indices[0];
  for(let i=1;i<indices.length;i++){
   const value=indices[i],key=(prefix<<8)|value,existing=gifDictionary[key];
   if(existing!==0xffff){prefix=existing;continue}
   writeCode(prefix);
   if(nextCode<4096){
    gifDictionary[key]=nextCode;nextCode+=1;
    if(nextCode>(1<<codeSize)&&codeSize<12)codeSize+=1;
   }else{
    writeCode(clearCode);gifResetDictionary();nextCode=258;codeSize=9;
   }
   prefix=value;
  }
  writeCode(prefix);
  writeCode(endCode);
 }
 if(bitCount)bytes[byteLength++]=buffer&255;
 return bytes.subarray(0,byteLength);
}

/* The palette leads with the brand colours, then the most common pixels of the
   first frame, then a 6×6×6 cube so photos and gradients stay close. */
function gifPalette(firstFrame){
 const out=[],seen=new Set();
 const add=colour=>{
  const r=clamp(Math.round(colour[0]),0,255),g=clamp(Math.round(colour[1]),0,255),b=clamp(Math.round(colour[2]),0,255);
  const key=(r>>2<<12)|(g>>2<<6)|(b>>2);
  if(seen.has(key)||out.length>=256)return;
  seen.add(key);out.push([r,g,b]);
 };
 const brand=[TH.ink,TH.accent,TH.bone,TH.chalk,EXPORT_BG].concat(Object.values(PAL||{}));
 brand.forEach(hex=>{const c=hx(hex);if(c)add(rgb(c))});
 const counts=new Map();
 if(firstFrame){
  const px=firstFrame.data;
  for(let i=0;i<px.length;i+=4*3){
   const key=((px[i]>>2)<<12)|((px[i+1]>>2)<<6)|(px[i+2]>>2);
   counts.set(key,(counts.get(key)||0)+1);
  }
 }
 [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,190).forEach(([key])=>{
  add([((key>>12)&63)*255/63,((key>>6)&63)*255/63,(key&63)*255/63]);
 });
 for(let r=0;r<6&&out.length<256;r+=1){
  for(let g=0;g<6&&out.length<256;g+=1){
   for(let b=0;b<6&&out.length<256;b+=1)add([r*51,g*51,b*51]);
  }
 }
 while(out.length<256)out.push([0,0,0]);
 return out;
}

function gifLookup(palette){
 const lookup=new Uint8Array(32768);
 for(let key=0;key<32768;key+=1){
  const red=((key>>10)&31)<<3,green=((key>>5)&31)<<3,blue=(key&31)<<3;
  let best=0,bestDistance=Infinity;
  for(let index=0;index<palette.length;index+=1){
   const colour=palette[index];
   const dr=red-colour[0],dg=green-colour[1],db=blue-colour[2];
   const distance=dr*dr+dg*dg+db*db;
   if(distance<bestDistance){bestDistance=distance;best=index}
  }
  lookup[key]=best;
 }
 return lookup;
}

function makeGifWriter(width,height,palette,lookup){
 const parts=[];
 const push=bytes=>parts.push(Uint8Array.from(bytes));
 const word=value=>push([value&255,(value>>8)&255]);
 const text=value=>push(Array.from(value,char=>char.charCodeAt(0)));
 text('GIF89a');
 word(width);word(height);
 push([0xf7,0,0]);
 palette.forEach(colour=>push(colour));
 push([0x21,0xff,0x0b]);
 text('NETSCAPE2.0');
 push([3,1,0,0,0]);
 return {
  addFrame(imageData,delayMs){
   const indices=new Uint8Array(width*height);
   const px=imageData.data;
   for(let pixel=0;pixel<indices.length;pixel+=1){
    const offset=pixel*4;
    indices[pixel]=lookup[((px[offset]>>3)<<10)|((px[offset+1]>>3)<<5)|(px[offset+2]>>3)];
   }
   const compressed=gifLzw(indices);
   push([0x21,0xf9,4,0x04]);
   word(Math.max(2,Math.round(delayMs/10)));
   push([0,0,0x2c]);
   word(0);word(0);word(width);word(height);
   push([0,8]);
   for(let offset=0;offset<compressed.length;offset+=255){
    const block=compressed.subarray(offset,offset+255);
    push([block.length]);
    parts.push(block);
   }
   push([0]);
  },
  finish(){
   push([0x3b]);
   return new Blob(parts,{type:'image/gif'});
  },
 };
}

/* ---------- ZIP (stored, no compression) ---------- */
let CRC_TABLE=null;
function crcTable(){
 if(CRC_TABLE)return CRC_TABLE;
 CRC_TABLE=new Uint32Array(256);
 for(let n=0;n<256;n+=1){
  let c=n;
  for(let k=0;k<8;k+=1)c=c&1?0xEDB88320^(c>>>1):c>>>1;
  CRC_TABLE[n]=c>>>0;
 }
 return CRC_TABLE;
}
function crc32(bytes){
 const table=crcTable();
 let c=0xFFFFFFFF;
 for(let i=0;i<bytes.length;i+=1)c=table[(c^bytes[i])&255]^(c>>>8);
 return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
 const chunks=[],central=[];
 const now=new Date();
 const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xffff;
 const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xffff;
 let offset=0;
 files.forEach(entry=>{
  const name=utf8(entry.name);
  const data=entry.data;
  const crc=crc32(data);
  const local=new Uint8Array(30+name.length);
  const lv=new DataView(local.buffer);
  lv.setUint32(0,0x04034b50,true);
  lv.setUint16(4,20,true);
  lv.setUint16(6,0x0800,true);
  lv.setUint16(8,0,true);
  lv.setUint16(10,dosTime,true);
  lv.setUint16(12,dosDate,true);
  lv.setUint32(14,crc,true);
  lv.setUint32(18,data.length,true);
  lv.setUint32(22,data.length,true);
  lv.setUint16(26,name.length,true);
  lv.setUint16(28,0,true);
  local.set(name,30);
  chunks.push(local,data);
  const cen=new Uint8Array(46+name.length);
  const cv=new DataView(cen.buffer);
  cv.setUint32(0,0x02014b50,true);
  cv.setUint16(4,20,true);
  cv.setUint16(6,20,true);
  cv.setUint16(8,0x0800,true);
  cv.setUint16(10,0,true);
  cv.setUint16(12,dosTime,true);
  cv.setUint16(14,dosDate,true);
  cv.setUint32(16,crc,true);
  cv.setUint32(20,data.length,true);
  cv.setUint32(24,data.length,true);
  cv.setUint16(28,name.length,true);
  cv.setUint32(42,offset,true);
  cen.set(name,46);
  central.push(cen);
  offset+=local.length+data.length;
 });
 const centralSize=central.reduce((sum,block)=>sum+block.length,0);
 const end=new Uint8Array(22);
 const ev=new DataView(end.buffer);
 ev.setUint32(0,0x06054b50,true);
 ev.setUint16(8,files.length,true);
 ev.setUint16(10,files.length,true);
 ev.setUint32(12,centralSize,true);
 ev.setUint32(16,offset,true);
 return new Blob([...chunks,...central,end],{type:'application/zip'});
}

async function gifBlob(){
 const frames=Math.round(clamp(DUR/1000*10,8,90));
 const W=Math.min(720,Math.round(FMT.w)),H=Math.max(2,Math.round(W*FMT.h/FMT.w));
 const cv=document.createElement('canvas');
 cv.width=W;cv.height=H;
 const ctx=cv.getContext('2d',{willReadFrequently:true});
 await paintScene(ctx,W,H,{time:0});
 const palette=gifPalette(ctx.getImageData(0,0,W,H));
 const writer=makeGifWriter(W,H,palette,gifLookup(palette));
 const delay=DUR/frames;
 for(let i=0;i<frames;i+=1){
  progress(`Rendering GIF frame ${i+1} of ${frames}…`);
  await paintScene(ctx,W,H,{time:Math.round(i*DUR/frames)});
  writer.addFrame(ctx.getImageData(0,0,W,H),delay);
  await new Promise(resolve=>setTimeout(resolve,0));
 }
 return writer.finish();
}

async function transcodeMp4(blob){
 const res=await fetch(`${API}/video/transcode`,{
  method:'POST',
  headers:{'Content-Type':blob.type||'video/webm'},
  body:blob,
 });
 if(!res.ok){
  const data=await res.json().catch(()=>null);
  throw new Error((data&&data.error)||`The server cannot transcode MP4 (${res.status}).`);
 }
 return await res.blob();
}

async function videoFile(){
 if(typeof MediaRecorder!=='function'||typeof HTMLCanvasElement.prototype.captureStream!=='function'){
  throw new Error('This browser cannot record video from a canvas.');
 }
 const W=Math.round(FMT.w),H=Math.round(FMT.h);
 const cv=document.createElement('canvas');
 cv.width=W;cv.height=H;
 const ctx=cv.getContext('2d');
 await paintScene(ctx,W,H,{time:0});
 const mimeList=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
 const mime=mimeList.find(candidate=>{
  try{return MediaRecorder.isTypeSupported(candidate)}catch{return false}
 })||'';
 const stream=cv.captureStream(30);
 let recorder;
 try{
  recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8000000}:undefined);
 }catch(error){
  stream.getTracks().forEach(track=>track.stop());
  throw new Error(`The browser refused to start recording: ${error.message}`);
 }
 const chunks=[];
 recorder.ondataavailable=event=>{if(event.data&&event.data.size)chunks.push(event.data)};
 const stopped=new Promise(resolve=>{recorder.onstop=resolve});
 recorder.start();
 const started=performance.now();
 await new Promise(resolve=>{
  const step=()=>{
   const elapsed=Math.min(DUR,performance.now()-started);
   progress(`Recording video ${(elapsed/1000).toFixed(1)}s of ${(DUR/1000).toFixed(1)}s…`);
   paintScene(ctx,W,H,{time:elapsed}).then(()=>{
    if(elapsed>=DUR)resolve();else requestAnimationFrame(step);
   });
  };
  requestAnimationFrame(step);
 });
 await new Promise(resolve=>requestAnimationFrame(()=>resolve()));
 recorder.stop();
 await stopped;
 stream.getTracks().forEach(track=>track.stop());
 const type=recorder.mimeType||mime||'video/webm';
 let blob=new Blob(chunks,{type});
 if(/mp4/i.test(type))return {blob,name:'.mp4'};
 try{
  progress('Converting the recording to MP4…');
  blob=await transcodeMp4(blob);
  return {blob,name:'.mp4'};
 }catch(error){
  toast(`Saved as WebM — ${error.message}`,true);
  return {blob,name:'.webm'};
 }
}
