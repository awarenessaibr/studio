/* ---------- animation export (baked, CSS-exact) ----------
   The stage plays motion with CSS animations, so the export evaluates the same
   @keyframes and timing functions the browser runs and stores the result as
   sampled frames. Studio Agent replays those frames directly. Copying preset
   names across engines cannot keep the motion identical, because both engines
   define the same preset names differently — and several Studio presets have no
   equivalent in Studio Agent at all. */
const ANIM_EXPORT_FPS=25;
const ANIM_EASE_OUT=animCubicBezier(0,0,.58,1);      /* CSS keyword: ease-out */
const ANIM_EASE_IN_OUT=animCubicBezier(.42,0,.58,1); /* CSS keyword: ease-in-out */
const ANIM_EASE_CLIP=animCubicBezier(.22,1,.36,1);   /* declared on every clip preset */
const ANIM_EXPORT_LOOPING=new Set(['pulse','float','glowPulse']);
/* Only presets with a @keyframes rule move on the stage. Anything else bakes as
   identity, which is what the stage actually shows. */
const ANIM_TRANSFORM_KEYFRAMES={
 fadeIn:q=>({opacity:q,dy:(1-q)*.02}),
 zoom:q=>({scale:1+.08*q}),
 parallax:q=>({scale:1.08,dy:-.025*q}),
};
function animCubicBezier(x1,y1,x2,y2){
 const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
 const fx=t=>((ax*t+bx)*t+cx)*t,fy=t=>((ay*t+by)*t+cy)*t,dfx=t=>(3*ax*t+2*bx)*t+cx;
 return x=>{
  if(!(x>0))return 0;
  if(x>=1)return 1;
  let t=x;
  for(let i=0;i<6;i++){const e=fx(t)-x;if(Math.abs(e)<1e-7)return fy(t);const d=dfx(t);if(Math.abs(d)<1e-7)break;t=Math.max(0,Math.min(1,t-e/d))}
  let lo=0,hi=1;
  for(let i=0;i<24;i++){if(fx(t)<x)lo=t;else hi=t;t=(lo+hi)/2}
  return fy(t);
 };
}
const ANIM_EXPORT_CLIP_BLEND=(from,to,q)=>from.map((point,i)=>[point[0]+(to[i][0]-point[0])*q,point[1]+(to[i][1]-point[1])*q]);
function animClipKeyframe(preset,q){
 const p=(u,v)=>[u,v];
 switch(preset){
  case 'clipWipeRight':return {shape:'poly',points:[[0,0],[q,0],[q,1],[0,1]]};
  case 'clipWipeLeft':return {shape:'poly',points:[[1-q,0],[1,0],[1,1],[1-q,1]]};
  case 'clipWipeDown':return {shape:'poly',points:[[0,0],[1,0],[1,q],[0,q]]};
  case 'clipWipeUp':return {shape:'poly',points:[[0,1-q],[1,1-q],[1,1],[0,1]]};
  case 'clipWipeDiag':return {shape:'poly',points:[[0,0],[q,0],[q,1],[0,1]]};
  case 'clipCornerIn':return {shape:'poly',points:[[0,0],[q,0],[q,q],[0,q]]};
  case 'clipIris':return {shape:'circle',cx:.5,cy:.5,r:.75*q/Math.SQRT2};
  case 'clipIrisTop':return {shape:'circle',cx:.5,cy:0,r:1.2*q/Math.SQRT2};
  case 'clipIrisBottom':return {shape:'circle',cx:.5,cy:1,r:1.2*q/Math.SQRT2};
  case 'clipDiamond':return {shape:'poly',points:ANIM_EXPORT_CLIP_BLEND([p(.5,.5),p(.5,.5),p(.5,.5),p(.5,.5)],[p(.5,0),p(1,.5),p(.5,1),p(0,.5)],q)};

  case 'clipChevron':return {shape:'poly',points:ANIM_EXPORT_CLIP_BLEND([p(0,.5),p(0,.5),p(0,.5),p(0,.5),p(0,.5),p(0,.5)],[p(0,0),p(.7,0),p(1,.5),p(.7,1),p(0,1),p(.3,.5)],q)};

function animPresetLabel(preset){

function animLayerRole(layer){

 if(type==='image'||(type!=='text'&&/photo|image|hero/.test(hay)))return 'image';
 if(type==='fill'||type==='gradient'||(type!=='text'&&/ground|background/.test(hay)))return 'background';
 if(type==='text'){

  if(/sub|deck|kicker|standfirst/.test(hay))return 'subhead';

/* Keyframe tracks drive geometry rather than CSS, so reuse their own easing. */

 let opacity=geometry?geometry.opacity:1;let opacityTouched=!!geometry;

 for(const event of animations){
  if(Array.isArray(event.keyframes))continue;

  const elapsed=t-start;

  }

function animRound(value){

function animFrameFor(layer,t){

  a:animRound(state.opacity),
  dx:animRound((state.x-base.x)/100+(state.transform?state.transform.dx:0)),
  dy:animRound((state.y-base.y)/100+(state.transform?state.transform.dy:0)),
  s:animRound(state.transform?state.transform.scale:1),
  sx:animRound(base.w?state.w/base.w:1),

  if(last.t!==first.t)out.push({t:last.t,...last.frame});

  const frame={t};

  if(s!==1)frame.s=s;

/* One baked segment per timeline event, so Studio Agent shows the same bars in

function animBakeSegment(layer,start,duration,looping){

 const to=Math.max(from+1,Math.min(DUR,Math.round(looping?DUR:start+duration)));
 if(to<=from)return null;
 const step=1000/ANIM_EXPORT_FPS,times=new Set([from,to]);
 for(let t=from;t<to;t+=step)times.add(Math.round(t));
 if(looping){
  for(let cycle=1;cycle<=48;cycle+=1){
   const time=Math.round(start+cycle*duration);
   if(time>to)break;
   times.add(time);
  }

 const samples=[...times].filter(t=>t>=from&&t<=to).sort((a,b)=>a-b);

function animBakeLayer(layer){
 const animations=timelineAnims(layer);

 for(const event of animations){
  if(Array.isArray(event.keyframes)){
   const times=event.keyframes.map(frame=>+frame.time).filter(Number.isFinite);
   if(times.length<2)continue;
   const frames=animBakeSegment(layer,Math.min(...times),Math.max(...times)-Math.min(...times),false);
   if(frames)segments.push({preset:'keyframes',label:animPresetLabel('keyframes'),start:Math.max(0,Math.min(DUR,Math.round(Math.min(...times)))),duration:frames[frames.length-1].t,loop:false,frames});
   continue;
  }
  const preset=String(event.preset||'motion');
  const start=Math.max(0,+event.start||0);
  const duration=Math.max(1,+event.duration||900);
  const looping=ANIM_EXPORT_LOOPING.has(preset);
  const frames=animBakeSegment(layer,start,duration,looping);
  if(!frames)continue;
  segments.push({preset,label:animPresetLabel(preset),start:Math.round(start),duration:frames[frames.length-1].t,loop:looping,frames});

function animationPayload(){

   layerName:layer.name||'',
   layerType:layer.type||'',
   role:animLayerRole(layer),
   text:layer.type==='text'?String(layer.text==null?'':layer.text):'',
   box:{x:(Number(layer.x)||0)/100,y:(Number(layer.y)||0)/100,w:(Number(layer.w)||100)/100,h:(Number(layer.h)||10)/100},
   segments:baked.segments,

  schema:'agent-studio/animation/2',
  kind:'studio-animation',
  id:`studio-animation-${Date.now().toString(36)}`,
  name:designName()||'Animation',
  createdAt:new Date().toISOString(),
  duration:DUR,
  fps:ANIM_EXPORT_FPS,
  source:{app:'layer-studio',design:designName()||'',layerCount:scene.length},

}

/* ==========================================================================
   Import a composition — Studio Layers projects, imports, a link or JSON
   ========================================================================== */
// Checked-in compositions point at artwork in /data/projects/<id>/(images|assets)
// and /data/imports/<id>/... The server serves those image/media files directly
// (see projectPublicFile/importPublicFile in server.js) but has no /api mirror
// for project images or import assets — so rewriting them to /api 404s every
// image layer and only the text layers survive. Keep the authored path as-is.
const serveableUrl=url=>String(url||'').trim();
function importedScene(composition){
 const safeLayers=Array.isArray(composition&&composition.layers)
  ? composition.layers.filter(layer=>layer&&typeof layer==='object')
  : [];
 const layers=compositionToScene({composition:{...composition,layers:safeLayers.map(layer=>{
  const next={...layer};
  const frameList=Array.isArray(layer.frames)?layer.frames:typeof layer.frames==='string'?[layer.frames]:[];
  const frames=frameList.map(serveableUrl).filter(value=>typeof value==='string'&&value.length);
  next.frames=frames;
  next.url=serveableUrl(layer.url||frames[0]||'');
  return next;
 })}});
 const source=new Map((composition.layers||[]).map(l=>[String(l&&l.id),l]));
 layers.forEach(layer=>{
  const from=source.get(layer.id);
  if(!from)return;
  if(from.bg)layer.bg=from.bg;
  if(from.radius!=null&&+from.radius>0)layer.radius=+from.radius;
  if(from.nowrap)layer.nowrap=true;
  if(Array.isArray(from.animations)&&from.animations.length)layer.anims=from.animations.map(event=>({...event}));
  else if(from.anim&&from.anim.preset&&!layer.anim)layer.anim={...from.anim};
  else if(from.animation&&from.animation.preset&&!layer.anim)layer.anim={...from.animation};
 });
 return layers;
}

async function adoptComposition(composition,label,source){
 if(!composition||!Array.isArray(composition.layers)||!composition.layers.length)throw new Error('That composition has no layers to load.');
 const next=importedScene(composition);
 if(!next.length)throw new Error('That composition has no layers to load.');
 const title=String(composition.name||label||'Imported composition');
 resetSaveState({...(source||{}),name:title});
 const w=Math.max(64,Math.round(+(composition.width||FMT.w)));
 const h=Math.max(64,Math.round(+(composition.height||FMT.h)));
 saveScene();
 FMT={id:'saved:imported',group:'Imported',n:title,w,h,saved:true};
 AS.savedActive=null;hist=[];clearLayerSelection();seen=new Set();stopP();
 setDuration(+(composition.duration)||DEFAULT_DUR);
 T=next.some(l=>timelineAnims(l).length)?0:DUR;
 fitStage();sizeProbe();
 scene=next;
 chrome();render();layers();assets();greet();remember();
 $('#status').textContent=`${title} · ${w}×${h}`;
 say('agent',`Imported <b>${esc(title)}</b> — ${next.length} editable layer${next.length===1?'':'s'} at ${w}×${h}px. Everything is on the canvas, the timeline and the layer panel.`);
 toast(`Imported ${title}`);
 return next.length;
}

async function compositionCandidates(){
 const list=[];
 try{
  const data=await jget(`${API}/projects`);
  (data&&data.projects||[]).forEach(project=>{
   if(!project||!project.id||project.id.indexOf('import-')===0)return;
   (project.compositions||[]).forEach(comp=>{
    list.push({key:`${project.id}/${comp.id}`,kind:'project',label:String(comp.name||comp.id),note:String(project.name||project.id)});
   });
  });
 }catch(error){list.push({key:'',kind:'error',label:'Studio projects unavailable',note:error.message})}
 try{
  const data=await jget(`${API}/imports`);
  (data&&data.projects||[]).forEach(item=>{
   if(!item||!item.id)return;
   list.push({key:`import:${item.id}`,kind:'import',label:String(item.name||item.id),
    note:`Import · ${item.layerCount||0} layer${item.layerCount===1?'':'s'} · ${item.width||'?'}×${item.height||'?'}`});
  });
 }catch(error){list.push({key:'',kind:'error',label:'Imports unavailable',note:error.message})}
 return list;
}

async function fetchCandidate(key){
 const text=String(key||'');
 const imported=/^import:(.+)$/.exec(text);
 if(imported)return await jget(`${API}/imports/${encodeURIComponent(imported[1])}/composition.json`);
 const [projectId,compositionId]=text.split('/');
 if(!projectId||!compositionId)throw new Error('That composition cannot be addressed.');
 return await jget(`${API}/projects/${encodeURIComponent(projectId)}/compositions/${encodeURIComponent(compositionId)}`);
}

function compositionPayload(data){
 if(data&&data.composition&&Array.isArray(data.composition.layers))return data.composition;
 if(data&&Array.isArray(data.layers))return data;
 if(data&&data.scene&&Array.isArray(data.scene.layers))return data.scene;
 throw new Error('That is not a Studio Layers composition — it has no layers.');
}

async function importFromValue(value){
 const text=String(value||'').trim();
 if(!text)throw new Error('Paste a composition link or some JSON first.');
 if(/^[[{]/.test(text)){
  let data;
  try{data=JSON.parse(text)}catch{throw new Error('That JSON could not be parsed.')}
  return compositionPayload(data);
 }
 const url=/^https?:\/\//.test(text)?text:(text.startsWith('/')?text:`/${text}`);
 /* Studio Import addresses files on disk; the server only serves them under /api. */
 return compositionPayload(await jget(url.replace(/\/data\/imports\//,'/api/imports/')));
}

function saveScene(){if(!B||demo)return;if(!LS.set(sceneKey(),{v:2,scene}))LS.del(sceneKey())}
function loadScene(){if(demo)return null;const d=LS.get(sceneKey(),null);return d&&d.v===2&&Array.isArray(d.scene)&&MASTER_IDS.size&&['ground','photo','headline'].every(id=>d.scene.some(l=>l.id===id))?d.scene:null}
const remember=()=>{LS.set('agentStudio.last.v1',{packId:P&&P.id,brandId:B&&B.id,fmt:FMT&&FMT.id});LS.set('agentStudio.lastBrands.v1',{...LS.get('agentStudio.lastBrands.v1',{}),[P.id]:B.id});
 if(!demo)try{const u=new URL(location.href);u.searchParams.set('pack',P.id);u.searchParams.set('brand',B.id);history.replaceState(null,'',u)}catch{}};

/* ---------- selection flow ---------- */
async function setFormat(id){
 const f=FMTS.find(x=>x.id===id)||FMTS[0];if(B)saveScene();FMT=f;AS.savedActive=null;resetSaveState();const kind=$('#fmtKind');if(kind)kind.value=fmtGroupFor(f.id);buildFormats();fitStage();sizeProbe();
 hist=[];clearLayerSelection();seen=new Set();
 if(B){const saved=loadScene();scene=saved||fitScene(buildScene('classic'));render();layers();assets();greet();remember()}}
async function selectBrand(id){
 const b=(P.brands||[]).find(x=>x.id===id);if(!b)return;const tok=++selTok;
 if(B)saveScene();resetSaveState();
 $('#brands').querySelectorAll('button').forEach(x=>x.disabled=true);
 B=b;deriveTheme(b);BF=brandFonts(b);hist=[];clearLayerSelection();seen=new Set();stopP();setDuration(DEFAULT_DUR);T=DUR;
 await Promise.all([brandLogos(b),engMedia(b),document.fonts&&document.fonts.ready].filter(Boolean)).catch(()=>{});
 if(tok!==selTok)return;
 (b.photography||[]).slice(0,1).forEach(p=>ensurePx(p.url));
 fitStage();sizeProbe();
 const saved=loadScene();scene=saved||(FMT.eng&&hasEngine()?engBuild():fitScene(buildScene('classic')));
 $('#brands').querySelectorAll('button').forEach(x=>x.disabled=false);
 chrome();render();layers();assets();greet();remember();loadLibrary(b);loadSavedTemplates(b);
 $('#status').textContent=`${b.name} · ${FMT.n}`}
const packFull=async id=>{if(packCache.has(id))return packCache.get(id);const d=await jget(`${API}/brand-packs/${encodeURIComponent(id)}`),p=d&&d.pack;if(!p||!(p.brands||[]).length)throw new Error('The brand group contains no brands.');packCache.set(id,p);return p};
async function selectPack(id,preferBrand){
 if(!id)return;const g=$('#grp');g.disabled=true;
 try{const p=await packFull(id);P=p;buildGroupSelect();buildBrandPills();
  const last=LS.get('agentStudio.lastBrands.v1',{})[id],pick=[preferBrand,last].find(x=>x&&p.brands.some(b=>b.id===x))||p.brands[0].id;
  B=null;await selectBrand(pick);toast(`${p.name||id} · ${p.brands.length} brand${p.brands.length===1?'':'s'}`)}
 catch(e){toast('Could not load that group: '+e.message,true);g.value=P?P.id:''}
 finally{g.disabled=false}}

/* ---------- boot ---------- */
function bootMsg(html,acts){$('#bootMsg').innerHTML=html;const a=$('#bootActs');a.innerHTML='';(acts||[]).forEach(([t,fn])=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;a.appendChild(b)});$('#boot').hidden=false}
function demoPack(){
 const brand={id:'demo-physician',name:'The Physician',tagline:'A table worth crossing town for',wordmark:'The Physician',
  palette:[{name:'Ink',hex:'#17162e'},{name:'Vermilion',hex:'#eb5b3c'},{name:'Bone',hex:'#ebe6e0'},{name:'Sand',hex:'#e8b58e'},{name:'Umber',hex:'#6b4c35'},{name:'Teal',hex:'#41baae'}],
  typography:{families:['Georgia','Helvetica Neue']},logos:[],photography:[{name:'Hero photo',url:DEMO_PHOTO}],
  guidelines:{positioning:'Seasonal plates, a considered drinks list and a room built for long lunches. Join us for dinner, private dining or a quiet drink at the bar.',contact:[{field:'Address',value:'129 South Street, St Andrews, KY16 9UH'},{field:'Website',value:'www.thephysician.bar'}]}};
 return{id:'demo',name:'Offline demo',brands:[brand]}}
async function startDemo(){demo=true;resetSaveState();$('#net').hidden=false;const p=demoPack();PACKS=[{id:p.id,name:p.name,brands:p.brands}];packCache.set(p.id,p);
 FMT=FMTS[0];buildFormats();P=p;buildGroupSelect();buildBrandPills();await selectBrand(p.brands[0].id);$('#boot').hidden=true}
async function boot(){
 FMT=FMTS[0];buildFormats();bootMsg('<b>Agent Studio</b><br>Loading brand groups…');
 try{
  const [d]=await Promise.all([jget(API+'/brand-packs'),loadFonts()]);
  PACKS=(d&&d.packs)||[];if(!PACKS.length)throw new Error('No brand packs are available.');
  const q=new URLSearchParams(location.search),last=LS.get('agentStudio.last.v1',{}),rb=q.get('brand')||q.get('brandId'),rp=q.get('pack')||q.get('packId');
  const byBrand=rb&&PACKS.find(p=>(p.brands||[]).some(b=>b.id===rb)),has=id=>id&&PACKS.some(p=>p.id===id);
  const packId=(byBrand&&byBrand.id)||(has(rp)?rp:null)||(has(last.packId)?last.packId:null)||PACKS[0].id;
  const fm=FMTS.find(f=>f.id===(q.get('format')||last.fmt));if(fm){FMT=fm;buildFormats()}
  P=await packFull(packId);buildGroupSelect();buildBrandPills();
  const lastMap=LS.get('agentStudio.lastBrands.v1',{}),want=[rb,last.packId===packId?last.brandId:null,lastMap[packId]].find(x=>x&&P.brands.some(b=>b.id===x))||P.brands[0].id;
  await selectBrand(want);$('#boot').hidden=true}
 catch(e){const m=String(e.message||e);
  bootMsg(`<b>Agent Studio could not load your brands.</b><br>${esc(/fetch|network|failed|load/i.test(m)?'Start the local studio server with `node server.js`, then reload.':m)}`,[['Reload',()=>location.reload()],['Open offline demo',()=>startDemo()],]);}}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{if(!FMT)return;fitStage();clearTimeout(wt);wt=setTimeout(()=>B&&watch(),60)}).observe(wrapEl);
else addEventListener('resize',fitStage);
boot();
})();
</script>
</body>
