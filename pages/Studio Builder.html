<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Inspect real Studio pages, pick building blocks into a cross-page project plan, compose the documented capabilities, load the real surface as a live preview, deploy a runnable page, and hand a build brief to a coding agent.">
<title>Studio Builder</title>
<link rel="stylesheet" href="/src/client/studio-builder/builder.css">
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <h1>Studio Builder</h1>
    <span class="status" id="catalogStatus" data-tone="warn" aria-live="polite"><span class="dot"></span>Loading catalog…</span>
    <button class="btn small" id="refresh" type="button" title="Refresh the capability catalog from the server">Sync</button>
    <span class="spacer"></span>
    <select id="preset" class="btn" aria-label="Start from a preset"><option value="">Start from…</option></select>
    <button class="btn" id="undo" type="button" disabled>Undo</button>
    <button class="btn" id="redo" type="button" disabled>Redo</button>
    <button class="btn" id="resetPanels" type="button" title="Restore the default region sizes">Reset panels</button>
    <button class="btn" id="theme" type="button" aria-label="Toggle light or dark">Theme</button>
    <button class="btn" id="liveToggle" type="button" aria-pressed="true" title="Embed the real surface selected by the stage renderer">Live preview</button>
    <button class="btn" id="dl" type="button">Download layout</button>
    <button class="btn" id="deploy" type="button" title="Write and serve a real page from this layout">Deploy</button>
    <button class="btn p" id="copy" type="button">Copy build brief</button>
  </div>

  <aside class="drawer" data-drawer="left" aria-label="Capability library">
    <button class="drawer-toggle" data-drawer-toggle="left" type="button" aria-expanded="true" aria-label="Collapse capability library" title="Collapse capability library">‹</button>
    <div class="dh"><h2>Capabilities</h2><span class="mu" id="count"></span></div>
    <div style="padding:10px 10px 0"><input type="search" id="q" placeholder="Search capabilities" aria-label="Search capabilities" autocomplete="off"></div>
    <div class="db" id="lib"></div>
  </aside>

  <div class="drawer-resizer" id="drawerLeftResizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize capability library"></div>

  <main class="canvas">
    <div class="issues" id="issues" aria-live="polite"></div>
    <div class="screen" id="screen"></div>
    <div class="runtime" id="runtime" data-reg="runtime"><label>Runs behind the screen</label></div>
  </main>

  <div class="drawer-resizer" id="drawerRightResizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize agent and details panel"></div>

  <aside class="drawer" data-drawer="right" aria-label="Agent, details and brief">
    <button class="drawer-toggle" data-drawer-toggle="right" type="button" aria-expanded="true" aria-label="Collapse agent and details panel" title="Collapse agent and details panel">›</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="agent" aria-selected="true">Agent</button>
      <button class="tab" role="tab" data-t="plan" aria-selected="false">Plan</button>
      <button class="tab" role="tab" data-t="detail" aria-selected="false">Details</button>
      <button class="tab" role="tab" data-t="brief" aria-selected="false">Brief</button>
      <button class="tab" role="tab" data-t="addons" aria-selected="false">Add-ons</button>
      <button class="tab" role="tab" data-t="deploy" aria-selected="false">Deploy</button>
    </div>
    <div class="db" id="pane"></div>
    <div id="agentTools">
      <div class="chips" id="chips"></div>
      <form class="ask" id="ask">
        <input class="in" id="in" placeholder="Tell the agent what to change" aria-label="Message to the agent" autocomplete="off">
        <button class="btn p" type="submit">Send</button>
      </form>
    </div>
  </aside>
</div>

<div id="toast" role="status" hidden></div>
<script src="/src/client/studio-builder/builder.js" defer></script>
</body>
</html>
