<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Studio</title>
<style>
/* ==========================================================================
   Dual theme system (system | light | dark)
   ========================================================================== */
:root {
  /* Dark (default) */
  --bg: #131217;
  --pan: #19181e;
  --rai: #23222b;
  --line: #2c2b35;
  --hi: #3a3946;
  --tx: #ecebf1;
  --mu: #8d8b9a;
  --ac: #e8803a;
  --ok: #41baae;
  --warn: #f5b942;
  --err: #e5584c;
  --err-bg: #7a2b25;
  --chip-bg: #1e1d24ee;
  --shadow: 0 10px 40px #0007;
  --safe: #00c2ff;
  color-scheme: dark;
}

html[data-theme="light"],
html[data-theme="system"]:not(.dark) {
  --bg: #e9e7ee;
  --pan: #ffffff;
  --rai: #f1eff5;
  --line: #d9d6e0;
  --hi: #c9c6d3;
  --tx: #1b1a24;
  --mu: #6c6a79;
  --ac: #d46a1f;
  --ok: #2a9d8f;
  --warn: #c9921a;
  --err: #c13c32;
  --err-bg: #9b2c24;
  --chip-bg: #2a2933ee;
  --shadow: 0 10px 36px rgba(0,0,0,.12);
  --safe: #0088cc;
  color-scheme: light;
}

html[data-theme="dark"],
html[data-theme="system"].dark {
  --bg: #131217;
  --pan: #19181e;
  --rai: #23222b;
  --line: #2c2b35;
  --hi: #3a3946;
  --tx: #ecebf1;
  --mu: #8d8b9a;
  --ac: #e8803a;
  --ok: #41baae;
  --warn: #f5b942;
  --err: #e5584c;
  --err-bg: #7a2b25;
  --chip-bg: #1e1d24ee;
  --shadow: 0 10px 40px #0007;
  --safe: #00c2ff;
  color-scheme: dark;
}

/* Fallback for older browsers that only understand prefers-color-scheme */
@media (prefers-color-scheme: light) {
  html[data-theme="system"]:not(.dark) {
    --bg: #e9e7ee;
    --pan: #ffffff;
    --rai: #f1eff5;
    --line: #d9d6e0;
    --hi: #c9c6d3;
    --tx: #1b1a24;
    --mu: #6c6a79;
    --ac: #d46a1f;
    --ok: #2a9d8f;
    --warn: #c9921a;
    --err: #c13c32;
    --err-bg: #9b2c24;
    --chip-bg: #2a2933ee;
    --shadow: 0 10px 36px rgba(0,0,0,.12);
    --safe: #0088cc;
    color-scheme: light;
  }
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  height: 100%;
}
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 13px/1.45 "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }

button, select {
  font: inherit;
  color: inherit;
  background: var(--rai);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 5px 9px;
  cursor: pointer;
  transition: border-color .15s, background .15s, opacity .15s;
}
button:hover, select:hover { border-color: var(--ac); }
button:disabled, select:disabled {
  opacity: .5;
  cursor: default;
  border-color: var(--line);
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 1px;
}

/* ==========================================================================
   Layout
   ========================================================================== */
#app {
  --left-panel: 270px;
  --right-panel: 390px;
  height: 100%;
  display: grid;
  grid-template-columns: var(--left-panel) 10px 1fr 10px var(--right-panel);
  grid-template-rows: 48px 1fr;
}

.resize-handle {
  position: relative;
  background: var(--pan);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  cursor: col-resize;
  user-select: none;
  touch-action: none;
}
.resize-handle::before {
  content: "";
  position: absolute;
  inset: 0 2px;
  pointer-events: none;
  background: linear-gradient(90deg, transparent 0, transparent 35%, var(--line) 35%, var(--line) 65%, transparent 65%, transparent 100%);
  opacity: .5;
}
.resize-handle:hover::before,
.resize-handle:active::before { opacity: 1; }
.resize-handle:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: -2px;
}
.resize-handle[data-collapsed] { background: var(--rai); }
.resize-handle[data-collapsed]::before { display: none; }
.resize-handle[data-collapsed]::after {
  content: '›';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18px;
  line-height: 1;
  color: var(--mu);
}
.resize-handle[data-resize="right"][data-collapsed]::after { content: '‹'; }
.resize-handle[data-collapsed]:hover::after { color: var(--ac); }

#app.l-collapsed aside,
#app.r-collapsed .agent { visibility: hidden; border: 0; }

/* ==========================================================================
   Header
   ========================================================================== */
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  background: var(--pan);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
header b { font-size: 14px; white-space: nowrap; }
header .sp { flex: 1; }
header select { max-width: 190px; text-overflow: ellipsis; }
header a {
  color: var(--mu);
  text-decoration: none;
  font-size: 12px;
  white-space: nowrap;
}
header a:hover { color: var(--tx); }
.logo {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--ac);
  display: grid;
  place-items: center;
  color: #131317;
  font-weight: 800;
  flex: none;
}
.bsw {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  min-width: 0;
  flex: 0 1 auto;
  padding: 2px 0;
  scrollbar-width: thin;
}
.bsw button {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  border-radius: 99px;
  padding: 3px 10px;
}
.bsw button[aria-pressed="true"] {
  border-color: var(--ac);
  background: var(--hi);
}
.bsw i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid var(--hi);
  flex: none;
}
#net {
  color: var(--warn);
  font-size: 12px;
  white-space: nowrap;
}

/* Theme toggle */
.theme-toggle {
  display: flex;
  gap: 2px;
  background: var(--rai);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px;
}
.theme-toggle button {
  padding: 3px 8px;
  border: 0;
  background: transparent;
  border-radius: 6px;
  font-size: 12px;
  color: var(--mu);
}
.theme-toggle button[aria-pressed="true"] {
  background: var(--hi);
  color: var(--tx);
  border: 1px solid var(--line);
}

/* ==========================================================================
   Sidebars & panels
   ========================================================================== */
aside {
  background: var(--pan);
  border-right: 1px solid var(--line);
  overflow: auto;
  min-height: 0;
  min-width: 0;
}
h3 {
  margin: 0;
  padding: 10px 12px 6px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mu);
}
h3 small {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 400;
}
h3[data-sec] {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 6px;
  cursor: pointer;
  user-select: none;
}
h3[data-sec]::before {
  content: '▾';
  font-size: 10px;
  color: var(--mu);
  width: 10px;
  display: inline-block;
  transition: transform .15s;
}
h3[data-sec][aria-expanded="false"]::before { transform: rotate(-90deg); }
h3[data-sec]:hover { color: var(--tx); }
h3[data-sec]:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: -2px;
}
.sec-body[hidden] { display: none; }

.atabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 10px 10px 6px;
}
.atabs button { flex: 1; padding: 4px 6px; font-size: 12px; }
.atabs button[aria-selected="true"] {
  border-color: var(--ac);
  background: var(--hi);
}
.sub {
  padding: 2px 12px 4px;
  color: var(--mu);
  font-size: 11px;
}
.assets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 10px 8px;
}
.asset {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--rai);
  padding: 6px;
  cursor: grab;
  font-size: 11px;
  text-align: center;
  min-width: 0;
}
.asset[data-choice] { cursor: pointer; }
.asset:hover { border-color: var(--ac); }
.asset.is-selected {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 12%, transparent), color-mix(in srgb, var(--ac) 4%, transparent));
}
.asset .th {
  height: 46px;
  border-radius: 5px;
  margin-bottom: 4px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  font: 700 11px Georgia, serif;
}
.asset .th img {
  max-width: 92%;
  max-height: 84%;
  object-fit: contain;
}
.asset span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.asset .st {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warn);
  margin-right: 4px;
}
.asset .st[data-s="verified"],
.asset .st[data-s="approved"] { background: var(--ok); }
.asset .st[data-s="rejected"] { background: var(--err); }

.eng-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 10px 8px;
  max-height: 300px;
  overflow: auto;
}
.eng-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--rai);
  padding: 5px;
  cursor: pointer;
  font-size: 11px;
  text-align: center;
  min-width: 0;
  color: inherit;
}
.eng-card:hover { border-color: var(--ac); }
.eng-card.is-selected {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
}
.eng-card canvas {
  display: block;
  width: 100%;
  height: auto;
  max-height: 150px;
  object-fit: contain;
  border-radius: 4px;
  background: color-mix(in srgb, var(--tx) 8%, transparent);
  margin-bottom: 4px;
}
.eng-card span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.eng-motif {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  padding: 0 10px 8px;
}
.eng-mt {
  padding: 3px;
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--rai);
  min-width: 0;
  color: inherit;
}
.eng-mt:hover { border-color: var(--ac); }
.eng-mt[aria-pressed="true"] {
  border-color: var(--ac);
  background: var(--hi);
}
.eng-mt canvas {
  display: block;
  width: 100%;
  height: 34px;
  object-fit: contain;
  border-radius: 4px;
  margin-bottom: 2px;
}
.eng-mt span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.eng-sl {
  padding: 0 12px 7px;
  font-size: 11px;
  color: var(--mu);
}
.eng-sl label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2px;
}
.eng-sl input { width: 100%; }
.eng-row {
  display: flex;
  gap: 6px;
  padding: 0 12px 8px;
  align-items: center;
}
.eng-row button { padding: 3px 9px; }
.eng-sel {
  display: block;
  width: calc(100% - 20px);
  margin: 0 10px 8px;
}
.template-list,
.mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 10px 8px;
}
.mini-grid { grid-template-columns: 1fr; }
.mini-grid .asset { min-height: 92px; }
.template-list .asset .th,
.mini-grid .asset .th {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.flt {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 0 10px 8px;
  font-size: 12px;
  color: var(--mu);
}
.flt select {
  flex: 1;
  min-width: 0;
  padding: 3px 6px;
}
.note {
  padding: 0 12px 10px;
  color: var(--mu);
  font-size: 12px;
}
.note a { color: var(--ac); }
.sw {
  display: flex;
  gap: 4px;
  padding: 0 12px 8px;
  flex-wrap: wrap;
}
.sw button {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--hi);
  padding: 0;
}
.lrow {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
}
.lrow:hover { background: var(--rai); }
.lrow[data-s="1"] {
  background: var(--hi);
  border-left-color: var(--ac);
}
.lrow span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lrow small { color: var(--mu); }
.lrow button {
  padding: 1px 6px;
  border: 0;
  background: transparent;
  color: var(--mu);
}

/* ==========================================================================
   Main stage
   ========================================================================== */
main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.tb {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--pan);
  flex-wrap: wrap;
}
.tb .sp { flex: 1; }
.tb label {
  color: var(--mu);
  display: flex;
  gap: 5px;
  align-items: center;
}
.wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tx) 6%, transparent), transparent);
}
.stage {
  container-type: size;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  flex: none;
  width: 300px;
  height: 424px;
}
.L {
  position: absolute;
  overflow: hidden;
  touch-action: none;
  cursor: move;
}
.T { display: flex; align-items: center; }
.sel {
  outline: 2px solid #fff;
  outline-offset: -2px;
}
.chip {
  position: absolute;
  left: 0;
  top: 0;
  background: var(--chip-bg);
  color: #fff;
  font: 11px Arial;
  padding: 2px 8px;
  border-radius: 99px;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}
.safe .stage::after {
  content: "";
  position: absolute;
  inset: 8%;
  border: 1px dashed var(--safe);
  pointer-events: none;
  z-index: 99;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(2cqh); }
  to { opacity: 1; }
}
@keyframes zoom { to { transform: scale(1.08); } }
@keyframes parallax {
  from { transform: scale(1.08); }
  to { transform: translateY(-2.5cqh) scale(1.08); }
}
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  .L[data-an] { animation: none !important; }
}

/* ==========================================================================
   Agent panel
   ========================================================================== */
.agent {
  display: flex;
  flex-direction: column;
  background: var(--pan);
  border-left: 1px solid var(--line);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.agent h4 {
  margin: 0;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}
.agent h4 .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.agent h4 button {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
}
#chat {
  flex: 1;
  overflow: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  max-height: calc(100vh - 120px);
}
#ctxMenu {
  position: fixed;
  z-index: 1000;
  display: none;
  min-width: 160px;
  padding: 6px;
  background: var(--rai);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: var(--shadow);
}
#ctxMenu.visible { display: block; }
#ctxMenu button {
  display: block;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  background: transparent;
  border-radius: 6px;
  text-align: left;
  color: var(--tx);
  cursor: pointer;
}
#ctxMenu button:hover { background: var(--hi); }
.m {
  max-width: 94%;
  padding: 8px 11px;
  border-radius: 12px;
  background: var(--rai);
  align-self: flex-start;
}
.m.u {
  align-self: flex-end;
  background: var(--ac);
  color: #131317;
}
.cards {
  display: grid;
  gap: 7px;
  align-self: stretch;
}
.card {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  background: var(--bg);
}
.card:hover { border-color: var(--ac); }
.card b { display: block; }
.card p {
  margin: 2px 0 7px;
  color: var(--mu);
  font-size: 12px;
}
.card .r {
  display: flex;
  gap: 6px;
  align-items: center;
}
.card .r small {
  color: var(--mu);
  flex: 1;
}
.card pre {
  margin: 7px 0 0;
  max-height: 150px;
  overflow: auto;
  font-size: 10.5px;
  background: var(--rai);
  padding: 6px;
  border-radius: 6px;
}
.card.done { border-color: var(--ok); }
.ctx {
  margin: 0 12px;
  padding: 6px 9px;
  border: 1px dashed var(--hi);
  border-radius: 8px;
  color: var(--mu);
  font-size: 12px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.ctx b { color: var(--tx); }
.ctx button {
  margin-left: auto;
  padding: 0 6px;
}
.qp {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  padding: 8px 12px 0;
}
.qp button {
  font-size: 11px;
  border-radius: 99px;
}
form {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
}
input[type=text] {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  color: var(--tx);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font: inherit;
}
form button {
  background: var(--ac);
  color: #131317;
  border: 0;
  font-weight: 700;
}

/* ==========================================================================
   Timeline
   ========================================================================== */
main {
  --timeline-height: 178px;
}
.tl {
  height: var(--timeline-height);
  flex: none;
  border-top: 1px solid var(--line);
  background: var(--pan);
  display: flex;
  flex-direction: column;
  min-height: 0;
  transition: height .15s ease;
}
.tl[data-collapsed="true"] {
  height: 12px;
  border-top: 1px solid var(--line);
}
.tl[data-collapsed="true"] .tlh,
.tl[data-collapsed="true"] .tlb {
  display: none;
}
.timeline-resize-handle {
  position: relative;
  height: 10px;
  background: var(--pan);
  border-top: 1px solid var(--line);
  cursor: row-resize;
  user-select: none;
  touch-action: none;
}
.timeline-resize-handle::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 38px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent 0%, var(--line) 20%, var(--line) 80%, transparent 100%);
}
.timeline-resize-handle[data-collapsed="true"]::before {
  width: 18px;
  background: linear-gradient(90deg, transparent 0%, var(--ac) 20%, var(--ac) 80%, transparent 100%);
}
.timeline-resize-handle[data-collapsed="true"]::after {
  content: '⌃';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ac);
  font-size: 14px;
  line-height: 1;
}
.tlh {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 6px 12px;
  border-bottom: 1px solid var(--line);
}
.tlh input[type=range] { flex: 1; }
.tlh output {
  font-variant-numeric: tabular-nums;
  color: var(--mu);
  min-width: 96px;
  text-align: right;
}
.tlb {
  flex: 1;
  overflow: auto;
  position: relative;
}
.tr {
  display: grid;
  grid-template-columns: 116px 1fr;
  height: 20px;
  align-items: center;
}
.tr .n {
  padding: 0 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: var(--mu);
  cursor: pointer;
}
.tr[data-s="1"] .n { color: var(--tx); }
.tk {
  position: relative;
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%);
}
.bar {
  position: absolute;
  top: 3px;
  height: 14px;
  border-radius: 4px;
  background: var(--ac);
  cursor: grab;
  min-width: 6px;
}
.bar::after {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 7px;
  cursor: ew-resize;
  background: color-mix(in srgb, #000 30%, transparent);
  border-radius: 0 4px 4px 0;
}
.bar span {
  display: block;
  font: 700 9px/14px Arial;
  color: #131317;
  padding-left: 5px;
  white-space: nowrap;
  overflow: hidden;
}
.ph {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #fff;
  pointer-events: none;
  z-index: 3;
  left: calc(116px + (100% - 116px) * var(--p, 1));
}
.warn { color: var(--warn); }
#gc { border-color: var(--hi); }

/* ==========================================================================
   Boot / Toast
   ========================================================================== */
#boot {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: var(--bg);
  text-align: center;
  padding: 24px;
}
#boot[hidden] { display: none; }
#boot .box {
  max-width: 420px;
  display: grid;
  gap: 12px;
  justify-items: center;
}
#boot .row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  z-index: 150;
  background: var(--hi);
  color: var(--tx);
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 12px;
  box-shadow: var(--shadow);
}
#toast[hidden] { display: none; }
#toast.err {
  background: var(--err-bg);
  color: #fff;
}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width: 980px) {
  .resize-handle { display: none; }
  #app.l-collapsed aside,
  #app.r-collapsed .agent { visibility: visible; }
  body { overflow: auto; }
  #app {
    height: auto;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
  aside { max-height: 300px; }
  .wrap { height: 80vh; flex: none; }
  .agent { height: 70vh; }
  header {
    flex-wrap: wrap;
    padding: 8px 12px;
  }
}

(function(){

/* ---------- dual theme ---------- */
const THEME_KEY='agentStudio.theme.v1';
function applyTheme(mode){
  const html=document.documentElement;

    const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;

  });

}

  const saved=LS.get(THEME_KEY,'system');

  mq.addEventListener('change',()=>{ if(document.documentElement.dataset.theme==='system') applyTheme('system'); });

    b.addEventListener('click',()=>applyTheme(b.dataset.theme));
  });

const PANEL={left:{min:200,max:420,def:270,prop:'--left-panel',cls:'l-collapsed'},right:{min:280,max:560,def:390,prop:'--right-panel',cls:'r-collapsed'}};

const resizeState={active:null,startX:0,start:0,moved:false,pid:null};

const timelineHandle=document.querySelector('.timeline-resize-handle');
const panelW=side=>{const v=parseFloat(getComputedStyle(appEl).getPropertyValue(PANEL[side].prop));return Number.isFinite(v)?v:PANEL[side].def};
const timelineW=()=>{const v=parseFloat(getComputedStyle(timelineEl).height);return Number.isFinite(v)?v:TIMELINE.def};
function setPanel(side,w,save=true){
 const P=PANEL[side],h=handleEl(side);
 if(w<=0){appEl.style.setProperty(P.prop,'0px');appEl.classList.add(P.cls);if(h){h.dataset.collapsed='1';h.setAttribute('aria-expanded','false');h.title='Click to open the sidebar'}}
 else{const v=clamp(w,P.min,P.max);appEl.style.setProperty(P.prop,v+'px');appEl.classList.remove(P.cls);lastW[side]=v;if(h){delete h.dataset.collapsed;h.setAttribute('aria-expanded','true');h.title='Drag to resize · drag past the edge or double-click to collapse'}}
 if(save)LS.set('agentStudio.panels.v1',{left:panelW('left'),right:panelW('right')})}
function setTimelineHeight(h,save=true){
 const v=clamp(h,0,TIMELINE.max);
 if(v<=24){
   timelineEl.style.height='12px';
   timelineEl.dataset.collapsed='true';
   timelineHandle.dataset.collapsed='true';
   timelineHandle.setAttribute('aria-expanded','false');
   timelineHandle.title='Click to reopen the timeline';
   if(save)LS.set('agentStudio.timeline.v1',0);
   return;
 }
 timelineEl.style.height=v+'px';
 timelineEl.style.setProperty('--timeline-height',v+'px');
 delete timelineEl.dataset.collapsed;
 delete timelineHandle.dataset.collapsed;
 timelineHandle.setAttribute('aria-expanded','true');
 timelineHandle.title='Drag to resize · drag upward to collapse';
 if(save)LS.set('agentStudio.timeline.v1',v);
}
function onResizeHandleMove(e){
 if(!resizeState.active)return;const side=resizeState.active,P=PANEL[side],dx=e.clientX-resizeState.startX;
 if(Math.abs(dx)>3)resizeState.moved=true;if(!resizeState.moved)return;
 const raw=side==='left'?resizeState.start+dx:resizeState.start-dx;
 setPanel(side,raw<P.min-40?0:raw,false)}
function stopResizeHandle(){
 const side=resizeState.active;window.removeEventListener('pointermove',onResizeHandleMove);window.removeEventListener('pointerup',stopResizeHandle);
 if(!side)return;
 if(!resizeState.moved&&handleEl(side).dataset.collapsed)setPanel(side,lastW[side]);else setPanel(side,panelW(side),true);
 resizeState.active=null}
function bindResizeHandles(){
 try{const saved=LS.get('agentStudio.panels.v1',null);if(saved)['left','right'].forEach(k=>{if(typeof saved[k]==='number')setPanel(k,saved[k]<=0?0:saved[k],false)})}catch{}
 document.querySelectorAll('.resize-handle').forEach(handle=>{
  const side=handle.dataset.resize;handle.setAttribute('role','separator');handle.setAttribute('aria-orientation','vertical');handle.tabIndex=0;
  if(!handle.title)handle.title='Drag to resize · drag past the edge or double-click to collapse';
  handle.setAttribute('aria-expanded',String(!handle.dataset.collapsed));
  handle.addEventListener('pointerdown',e=>{resizeState.active=side;resizeState.startX=e.clientX;resizeState.start=panelW(side);resizeState.moved=false;
   window.addEventListener('pointermove',onResizeHandleMove);window.addEventListener('pointerup',stopResizeHandle);e.preventDefault()});
  handle.addEventListener('dblclick',()=>{if(handle.dataset.collapsed)setPanel(side,lastW[side]);else setPanel(side,0)});
  handle.addEventListener('keydown',e=>{
   if(e.key==='Enter'||e.key===' '){e.preventDefault();setPanel(side,handle.dataset.collapsed?lastW[side]:0);return}
   if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();
   const grow=(e.key==='ArrowRight')===(side==='left'),cur=handle.dataset.collapsed?0:panelW(side),P=PANEL[side];
   setPanel(side,grow?Math.max(P.min,cur+16):(cur-16<P.min?0:cur-16))})})}
function bindTimelineResize(){
 try{const saved=LS.get('agentStudio.timeline.v1',TIMELINE.def);if(typeof saved==='number'){setTimelineHeight(saved<=0?0:saved,false)}}catch{}
 const drag=(e)=>{
  if(!timelineResizeState.active)return;const dy=e.clientY-timelineResizeState.startY;
  if(Math.abs(dy)>3)timelineResizeState.moved=true;if(!timelineResizeState.moved)return;
  const next=timelineResizeState.startH-dy;
  setTimelineHeight(next<=24?0:next,false);
 };
 const stop=()=>{
  if(!timelineResizeState.active)return;

  else setTimelineHeight(current,true);
  timelineResizeState.active=false;
  window.removeEventListener('pointermove',drag);
  window.removeEventListener('pointerup',stop);
 };
 timelineHandle.setAttribute('role','separator');
 timelineHandle.setAttribute('aria-orientation','vertical');
 timelineHandle.tabIndex=0;
 timelineHandle.addEventListener('pointerdown',e=>{
  timelineResizeState.active=true;timelineResizeState.startY=e.clientY;timelineResizeState.startH=timelineW();timelineResizeState.moved=false;
  window.addEventListener('pointermove',drag);window.addEventListener('pointerup',stop);e.preventDefault();
 });

 timelineHandle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setTimelineHeight(timelineHandle.dataset.collapsed?TIMELINE.def:0);return}if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return; e.preventDefault(); const cur=timelineHandle.dataset.collapsed?0:timelineW(); const delta=e.key==='ArrowUp'?16:-16; setTimelineHeight(clamp(cur+delta,0,TIMELINE.max));});

/* ---------- collapsible sidebar sections ---------- */

const hx=s=>{s=String(s||'').trim();const m=/^#([0-9a-f]{3})$/i.exec(s);if(m)return'#'+[...m[1]].map(c=>c+c).join('').toLowerCase();return/^#[0-9a-f]{6}$/i.test(s)?s.toLowerCase():null};

function deriveTheme(b){

 const m=ev=>{if(!mv){hist.push(clone(scene));mv=true}const dt=Math.round((ev.clientX-sx)/tk.width*DUR/100)*100;
  if(edge)l.anim.duration=Math.max(100,Math.min(DUR-s0,d0+dt));else l.anim.start=Math.max(0,Math.min(DUR-l.anim.duration,s0+dt));pxb(l,b);render();seek(T)};
 const u=()=>{removeEventListener('pointermove',m);removeEventListener('pointerup',u);if(mv){tl();say('agent',`${esc(l.name)}: ${l.anim.preset} now starts at ${(l.anim.start/1000).toFixed(1)}s and runs ${(l.anim.duration/1000).toFixed(1)}s.`);saveScene()}};
 addEventListener('pointermove',m);addEventListener('pointerup',u)}
function tl(){const w=$('#tlb');w.innerHTML=`<div class="tr"><div class="n"></div><div class="tk" style="cursor:pointer">${[...Array(11)].map((_,i)=>`<small style="position:absolute;left:${i*10}%;font-size:9px;color:var(--mu);padding-left:2px">${i}s</small>`).join('')}</div></div>`;
 const rul=w.querySelector('.tk'),go=ev=>{const r=rul.getBoundingClientRect();stopP();seek((ev.clientX-r.left)/r.width*DUR)};
 rul.onpointerdown=ev=>{go(ev);const u=()=>{removeEventListener('pointermove',go);removeEventListener('pointerup',u)};addEventListener('pointermove',go);addEventListener('pointerup',u)};
 scene.filter(l=>!l.hidden).sort((a,b)=>b.z-a.z).forEach(l=>{const r=document.createElement('div');r.className='tr';r.dataset.s=l.id===sel?1:0;r.innerHTML=`<div class="n">${esc(l.name)}</div><div class="tk"></div>`;r.querySelector('.n').onclick=()=>select(l.id);
  if(l.anim){const b=document.createElement('div');b.className='bar';b.innerHTML=`<span>${l.anim.preset}</span>`;pxb(l,b);b.onpointerdown=e=>bd(e,l,b);r.querySelector('.tk').appendChild(b)}w.appendChild(r)});
 const ph=document.createElement('div');ph.className='ph';w.appendChild(ph);seek(T)}

/* ---------- chat ---------- */
function say(who,html,cards=[]){const m=document.createElement('div');m.className='m'+(who==='user'?' u':'');m.innerHTML=html;chat.appendChild(m);
 if(cards.length){const w=document.createElement('div');w.className='cards';cards.forEach(c=>{const d=document.createElement('div');d.className='card';
  d.innerHTML=`<b>${esc(c.title)}</b><p>${esc(c.why)}</p><div class="r"><small>${c.cmds.length} command${c.cmds.length===1?'':'s'} · hover to preview</small><button data-j>JSON</button><button data-a ${c.cmds.length||c.ask?'':'disabled'}>Apply</button></div>`;
  const sm=d.querySelector('small');
  d.onmouseenter=()=>{if(!c.cmds.length||d.classList.contains('done'))return;const t=run(clone(scene),c.cmds);render(t);const ks=new Set(check(scene).map(i=>i.key)),nw=check(t).filter(i=>!ks.has(i.key));render(t);sm.innerHTML=nw.length?`<span class="warn">⚠ introduces ${nw.length}: ${nw.map(i=>LABEL[i.code]).join(', ')}</span>`:'✓ guardrails clean'};
  d.onmouseleave=()=>render();
  d.querySelector('[data-j]').onclick=()=>{let p=d.querySelector('pre');if(p)return p.remove();p=document.createElement('pre');p.textContent=JSON.stringify(c.cmds,null,1);d.appendChild(p)};
  d.querySelector('[data-a]').onclick=e=>{if(c.ask)return ask(c.ask);commit(c.cmds);d.classList.add('done');e.target.textContent='Applied ✓';e.target.disabled=true;$('#status').textContent=`Applied: ${c.title}`};
  w.appendChild(d)});chat.appendChild(w)}
 chat.scrollTop=chat.scrollHeight}
function ask(t){say('user',esc(t));const l=scene.find(q=>q.id===sel);setTimeout(()=>{
 if(!l){const lm=t.toLowerCase(),an=lm.includes('anim'),C=concepts();const c=lm.includes('hier')?[C[3]]:an?[C[4]]:C.slice(0,3);
  say('agent',lm.includes('hier')?'One structural issue I can see:':an?'A staggered entrance for the whole design. Drag the bars in the timeline to retime it:':'Three directions for the whole design, built from this brand’s palette and type. Hover to preview each on the canvas:',c)}
 else{const c=suggest(l,t);say('agent',c.length?`For <b>${esc(l.name)}</b>:`:`I can’t do that to <b>${esc(l.name)}</b> yet. Try “bigger”, “accent colour”, “animate it” or “move up”.`,c)}},300)}
function deleteSelection(){if(!sel)return;const l=scene.find(q=>q.id===sel);if(!l)return;hist.push(clone(scene));scene=scene.filter(q=>q.id!==sel);sel=null;render();layers();$('#status').textContent=l.name?`Deleted ${l.name}.`:'Deleted layer.';closeContextMenu()}
function closeContextMenu(){const menu=$('#ctxMenu');if(menu){menu.innerHTML='';menu.classList.remove('visible');menu.setAttribute('hidden','hidden')}}
function showContextMenu(event, layerId){const menu=$('#ctxMenu');if(!menu)return;event.preventDefault();const item=scene.find(q=>q.id===layerId);if(!item)return;menu.innerHTML='';const btn=document.createElement('button');btn.type='button';btn.setAttribute('role','menuitem');btn.textContent='Delete layer';btn.onclick=()=>{deleteSelection()};menu.appendChild(btn);menu.classList.add('visible');menu.removeAttribute('hidden');const left=Math.min(event.clientX+10,window.innerWidth-180);const top=Math.min(event.clientY+10,window.innerHeight-80);menu.style.left=left+'px';menu.style.top=top+'px'}
$('#f').onsubmit=e=>{e.preventDefault();const v=$('#in').value.trim();if(v){$('#in').value='';ask(v)}};
$('#clearChat').onclick=()=>{chat.innerHTML='';$('#status').textContent='Chat cleared.'};
document.addEventListener('keydown',(event)=>{const target=event.target;const editable=target&&((target.isContentEditable)||(target.tagName==='INPUT')||(target.tagName==='TEXTAREA')||(target.tagName==='SELECT'));if(editable)return;if((event.key==='Delete'||event.key==='Backspace')&&sel){event.preventDefault();deleteSelection()}});
document.addEventListener('click',e=>{if(!e.target.closest('#ctxMenu'))closeContextMenu()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('#ctxMenu'))closeContextMenu()});
stage.addEventListener('contextmenu',e=>{const layer=e.target.closest('.L');if(!layer)return;const id=layer.dataset.id;select(id);showContextMenu(e,id)});
function greet(){chat.innerHTML='';say('agent',`Hi, I’m the Studio agent. I can see the <b>${esc(B.name)}</b> ${esc(FMT.n.toLowerCase())}, built from its palette (${Object.keys(PAL).length} colours), type and imagery. <b>Select a layer</b> or <b>drag an asset onto the canvas</b> and I’ll propose options for that exact element. With nothing selected, here are directions for the whole design:`,concepts().slice(0,3))}

/* ---------- toolbar ---------- */
$('#undo').onclick=()=>{if(hist.length){scene=hist.pop();if(!scene.find(l=>l.id===sel))sel=null;render();layers();$('#status').textContent='Undone.'}};
$('#reset').onclick=()=>{hist.push(clone(scene));LS.del(sceneKey());scene=fitScene(buildScene('classic'));sel=null;render();layers();toast('Scene reset to the brand defaults.')};
$('#play').onclick=()=>play(0);
$('#sz').onchange=e=>$('#app').classList.toggle('safe',e.target.checked);
wrapEl.onclick=e=>{if(e.target.id==='wrap')select(null)};
$('#grp').onchange=e=>selectPack(e.target.value);
bindFormatSelectors();

/* ---------- persistence ---------- */
const sceneKey=()=>`agentStudio.scene.v2:${B&&B.id}:${FMT&&FMT.id}`;
function saveScene(){if(!B||demo)return;if(!LS.set(sceneKey(),{v:2,scene}))LS.del(sceneKey())}
function loadScene(){if(demo)return null;const d=LS.get(sceneKey(),null);return d&&d.v===2&&Array.isArray(d.scene)&&MASTER_IDS.size&&['ground','photo','headline'].every(id=>d.scene.some(l=>l.id===id))?d.scene:null}
const remember=()=>{LS.set('agentStudio.last.v1',{packId:P&&P.id,brandId:B&&B.id,fmt:FMT&&FMT.id});LS.set('agentStudio.lastBrands.v1',{...LS.get('agentStudio.lastBrands.v1',{}),[P.id]:B.id});
 if(!demo)try{const u=new URL(location.href);u.searchParams.set('pack',P.id);u.searchParams.set('brand',B.id);history.replaceState(null,'',u)}catch{}};

/* ---------- selection flow ---------- */
async function setFormat(id){
 const f=FMTS.find(x=>x.id===id)||FMTS[0];if(B)saveScene();FMT=f;const kind=$('#fmtKind');if(kind)kind.value=fmtGroupFor(f.id);buildFormats();fitStage();sizeProbe();
 hist=[];sel=null;seen=new Set();
 if(B){const saved=loadScene();scene=saved||fitScene(buildScene('classic'));render();layers();assets();greet();remember()}}
async function selectBrand(id){
 const b=(P.brands||[]).find(x=>x.id===id);if(!b)return;const tok=++selTok;
 if(B)saveScene();
 $('#brands').querySelectorAll('button').forEach(x=>x.disabled=true);
 B=b;deriveTheme(b);BF=brandFonts(b);hist=[];sel=null;seen=new Set();stopP();T=DUR;
 await Promise.all([brandLogos(b),engMedia(b),document.fonts&&document.fonts.ready].filter(Boolean)).catch(()=>{});
 if(tok!==selTok)return;
 (b.photography||[]).slice(0,1).forEach(p=>ensurePx(p.url));
 fitStage();sizeProbe();
 const saved=loadScene();scene=saved||(FMT.eng&&hasEngine()?engBuild():fitScene(buildScene('classic')));
 $('#brands').querySelectorAll('button').forEach(x=>x.disabled=false);
 chrome();render();layers();assets();greet();remember();loadLibrary(b);
 $('#status').textContent=`${b.name} · ${FMT.n}`}
const packFull=async id=>{if(packCache.has(id))return packCache.get(id);const d=await jget(`${API}/brand-packs/${encodeURIComponent(id)}`),p=d&&d.pack;if(!p||!(p.brands||[]).length)throw new Error('The brand group contains no brands.');packCache.set(id,p);return p};
async function selectPack(id,preferBrand){
 if(!id)return;const g=$('#grp');g.disabled=true;
 try{const p=await packFull(id);P=p;buildGroupSelect();buildBrandPills();
  const last=LS.get('agentStudio.lastBrands.v1',{})[id],pick=[preferBrand,last].find(x=>x&&p.brands.some(b=>b.id===x))||p.brands[0].id;
  B=null;await selectBrand(pick);toast(`${p.name||id} · ${p.brands.length} brand${p.brands.length===1?'':'s'}`)}
 catch(e){toast('Could not load that group: '+e.message,true);g.value=P?P.id:''}
 finally{g.disabled=false}}

/* ---------- boot ---------- */
function bootMsg(html,acts){$('#bootMsg').innerHTML=html;const a=$('#bootActs');a.innerHTML='';(acts||[]).forEach(([t,fn])=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;a.appendChild(b)});$('#boot').hidden=false}
function demoPack(){
 const brand={id:'demo-physician',name:'The Physician',tagline:'A table worth crossing town for',wordmark:'The Physician',
  palette:[{name:'Ink',hex:'#17162e'},{name:'Vermilion',hex:'#eb5b3c'},{name:'Bone',hex:'#ebe6e0'},{name:'Sand',hex:'#e8b58e'},{name:'Umber',hex:'#6b4c35'},{name:'Teal',hex:'#41baae'}],
  typography:{families:['Georgia','Helvetica Neue']},logos:[],photography:[{name:'Hero photo',url:DEMO_PHOTO}],
  guidelines:{positioning:'Seasonal plates, a considered drinks list and a room built for long lunches. Join us for dinner, private dining or a quiet drink at the bar.',contact:[{field:'Address',value:'129 South Street, St Andrews, KY16 9UH'},{field:'Website',value:'www.thephysician.bar'}]}};
 return{id:'demo',name:'Offline demo',brands:[brand]}}
async function startDemo(){demo=true;$('#net').hidden=false;const p=demoPack();PACKS=[{id:p.id,name:p.name,brands:p.brands}];packCache.set(p.id,p);
 FMT=FMTS[0];buildFormats();P=p;buildGroupSelect();buildBrandPills();await selectBrand(p.brands[0].id);$('#boot').hidden=true}
async function boot(){
 FMT=FMTS[0];buildFormats();bootMsg('<b>Agent Studio</b><br>Loading brand groups…');
 try{
  const [d]=await Promise.all([jget(API+'/brand-packs'),loadFonts()]);
  PACKS=(d&&d.packs)||[];if(!PACKS.length)throw new Error('No brand packs are available.');
  const q=new URLSearchParams(location.search),last=LS.get('agentStudio.last.v1',{}),rb=q.get('brand')||q.get('brandId'),rp=q.get('pack')||q.get('packId');
  const byBrand=rb&&PACKS.find(p=>(p.brands||[]).some(b=>b.id===rb)),has=id=>id&&PACKS.some(p=>p.id===id);
  const packId=(byBrand&&byBrand.id)||(has(rp)?rp:null)||(has(last.packId)?last.packId:null)||PACKS[0].id;
  const fm=FMTS.find(f=>f.id===(q.get('format')||last.fmt));if(fm){FMT=fm;buildFormats()}
  P=await packFull(packId);buildGroupSelect();buildBrandPills();
  const lastMap=LS.get('agentStudio.lastBrands.v1',{}),want=[rb,last.packId===packId?last.brandId:null,lastMap[packId]].find(x=>x&&P.brands.some(b=>b.id===x))||P.brands[0].id;
  await selectBrand(want);$('#boot').hidden=true}
 catch(e){const m=String(e.message||e);
  bootMsg(`<b>Agent Studio could not load your brands.</b><br>${esc(/fetch|network|failed|load/i.test(m)?'Start the local studio server with `node server.js`, then reload.':m)}`,[['Reload',()=>location.reload()],['Open offline demo',()=>startDemo()],]);}}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{if(!FMT)return;fitStage();clearTimeout(wt);wt=setTimeout(()=>B&&watch(),60)}).observe(wrapEl);
else addEventListener('resize',fitStage);
boot();
})();
</script>
