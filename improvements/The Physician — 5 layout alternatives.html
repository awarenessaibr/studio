<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Physician — 5 layout alternatives</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ec;--fg:#17162e;--mut:#6b6a7a;--card:#fff;--line:#ddd7cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121120;--fg:#ebe6e0;--mut:#9a98ab;--card:#1c1b30;--line:#33314d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}
header{max-width:1600px;margin:0 auto;padding:28px 20px 8px}
h1{font:400 28px/1.15 Georgia,serif;margin:0 0 6px}
p.sub{margin:0 0 14px;color:var(--mut);font-size:14px;max-width:70ch;line-height:1.5}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,label.t{font:500 13px "Helvetica Neue",Arial,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer}
main{max-width:1600px;margin:0 auto;padding:12px 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font:600 14px "Helvetica Neue",Arial,sans-serif;margin:2px 0 2px}
.card .d{font-size:12px;color:var(--mut);margin:0 0 10px;line-height:1.4;min-height:2.8em}
.stage{width:100%;aspect-ratio:1748/2480;container-type:size;position:relative;overflow:hidden;box-shadow:0 2px 14px #0003}
.L{position:absolute;overflow:hidden}
.T{display:flex;align-items:center}
.safe .stage::after{content:"";position:absolute;inset:8%;border:1px dashed #00c2ff;pointer-events:none;z-index:99}
details{margin-top:10px;font-size:12px}
summary{cursor:pointer;color:var(--mut)}
pre{overflow:auto;max-height:220px;background:var(--bg);padding:8px;border-radius:6px;font-size:10.5px;line-height:1.4}
@keyframes fadeIn{from{opacity:0;transform:translateY(2cqh)}to{opacity:1}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes parallax{from{transform:translateY(0) scale(1.08)}to{transform:translateY(-2.5cqh) scale(1.08)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style></head><body>
<header>
<h1>The Physician — five layout alternatives</h1>
<p class="sub">Each card is the master scene plus a batch of agent commands (<code>set-layer</code>, <code>add-layer</code>, <code>swap-asset</code>, <code>set-animation</code>), applied by the small engine in this page. Photo is cropped from your PNG; the wordmark is a typographic stand-in for the real asset.</p>

/* ---- command engine ---- */
function apply(cmds){
 let S=JSON.parse(JSON.stringify(MASTER));const anim={};
 const get=id=>S.find(l=>l.id===id);
 for(const c of cmds){
  if(c.type==="set-layer"){const l=get(c.layerId);for(const[k,v]of Object.entries(c.patch)){if(k==="font")Object.assign(l.font,v);else l[k]=v}}
  else if(c.type==="add-layer")S.push({opacity:1,...c.layer});
  else if(c.type==="swap-asset")get(c.layerId).asset=c.asset;
  else if(c.type==="set-animation")anim[c.layerId]=c;
 }
 return{S,anim};
}
function render(S,anim){
 const st=document.createElement("div");st.className="stage";
 for(const l of S.slice().sort((a,b)=>a.z-b.z)){
  const e=document.createElement("div");e.className="L";e.dataset.id=l.id;
  Object.assign(e.style,{left:l.x+"%",top:l.y+"%",width:l.w+"%",height:l.h+"%",zIndex:l.z,opacity:l.opacity});
  if(l.type==="fill")e.style.background=l.color;
  if(l.type==="gradient")e.style.background=`linear-gradient(${l.from},${l.to})`;
  if(l.type==="image")e.style.cssText+=`;background:url(${PHOTO}) center/cover`;
  if(l.type==="logo"){e.classList.add("T");e.style.overflow="visible";e.style.justifyContent="center";
   e.innerHTML=`<span style="font:700 ${l.h*.5}cqh/1 Georgia,serif;letter-spacing:.01em;white-space:nowrap;color:${l.asset==="white"?"#fff":INK}"><small style="font-size:.62em">THE </small>PHYSICIAN</span>`;
   if(l.x>=8&&l.x<20)e.style.justifyContent="flex-start"}
  if(l.type==="text"){e.classList.add("T");const f=l.font;
   Object.assign(e.style,{color:l.color,fontFamily:`"${f.family}",${f.family==="Georgia"?"serif":"Arial,sans-serif"}`,fontWeight:f.weight,fontSize:f.sizePct+"cqh",lineHeight:f.lineHeight,letterSpacing:f.letterSpacingEm+"em",textTransform:f.transform});
   e.textContent=l.text;if(l.id==="flyer-footer")e.style.whiteSpace="nowrap"}
  const a=anim[l.id];
  if(a){e.dataset.a=JSON.stringify(a);e.style.animation=`${a.preset} ${a.duration}ms ${a.start}ms both ${a.preset==="pulse"?"infinite":"ease-out"}`}
  st.appendChild(e)}
 return st;
}
const grid=document.getElementById("grid");
VARIANTS.forEach(v=>{
 const{S,anim}=apply(v.cmds);
 const c=document.createElement("section");c.className="card";
 c.innerHTML=`<h2>${v.name}</h2><p class="d">${v.desc}</p>`;
 c.appendChild(render(S,anim));
 const d=document.createElement("details");
 d.innerHTML=`<summary>${v.cmds.length} commands</summary><pre></pre>`;
 d.querySelector("pre").textContent=JSON.stringify(v.cmds,null,1);
 c.appendChild(d);grid.appendChild(c)});
