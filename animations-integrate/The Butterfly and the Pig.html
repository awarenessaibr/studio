}
window.__sim={step,draw,reset,get t(){return t}};
let paused=false,last=0,acc=0;
function frame(ts){
  if(!paused){
    acc+=Math.min(0.1,(ts-last)/1000);
    while(acc>=DT){step();acc-=DT;if(t>=LOOP)reset()}
  }
  last=ts;draw();requestAnimationFrame(frame);
}
function start(){
  reset();
  window.__ready=true;
  if(window.__manual)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){while(t<17)step();paused=true;document.getElementById('pp').textContent='Play'}
  requestAnimationFrame(ts=>{last=ts;frame(ts)});
}
document.getElementById('pp').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
document.getElementById('rs').onclick=()=>{reset();acc=0};
</script>
