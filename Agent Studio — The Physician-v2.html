<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Studio — The Physician</title>
<style>
:root{--bg:#131217;--pan:#19181e;--rai:#23222b;--line:#2c2b35;--hi:#3a3946;--tx:#ecebf1;--mu:#8d8b9a;--ac:#e8803a;--ok:#41baae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e7ee;--pan:#fff;--rai:#f1eff5;--line:#d9d6e0;--hi:#c9c6d3;--tx:#1b1a24;--mu:#6c6a79}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 "Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--rai);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.5;cursor:default;border-color:var(--line)}
#app{height:100%;display:grid;grid-template-columns:250px 1fr 390px;grid-template-rows:44px 1fr}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--pan);border-bottom:1px solid var(--line)}
header b{font-size:14px}header .sp{flex:1}
.logo{width:22px;height:22px;border-radius:6px;background:var(--ac);display:grid;place-items:center;color:#131317;font-weight:800}
aside{background:var(--pan);border-right:1px solid var(--line);overflow:auto;min-height:0}
h3{margin:0;padding:10px 12px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.assets{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 8px}
.asset{border:1px solid var(--line);border-radius:8px;background:var(--rai);padding:6px;cursor:grab;font-size:11px;text-align:center}
.asset:hover{border-color:var(--ac)}.asset .th{height:46px;border-radius:5px;margin-bottom:4px;display:grid;place-items:center;overflow:hidden;background-size:cover;background-position:center;font:700 11px Georgia,serif}
.sw{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}.sw i{width:20px;height:20px;border-radius:50%;border:1px solid var(--hi)}
.lrow{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;border-left:2px solid transparent}
.lrow:hover{background:var(--rai)}.lrow[data-s="1"]{background:var(--hi);border-left-color:var(--ac)}
.lrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lrow small{color:var(--mu)}
.lrow button{padding:1px 6px;border:0;background:transparent;color:var(--mu)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--pan)}
.tb .sp{flex:1}.tb label{color:var(--mu);display:flex;gap:5px;align-items:center}
.wrap{flex:1;min-height:0;display:flex;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#00000014,transparent)}
.stage{height:100%;aspect-ratio:1748/2480;container-type:size;position:relative;overflow:hidden;box-shadow:0 10px 40px #0007;flex:none}
.L{position:absolute;overflow:hidden;touch-action:none;cursor:move}.T{display:flex;align-items:center}
.sel{outline:2px solid #fff;outline-offset:-2px}
.chip{position:absolute;left:0;top:0;background:#1e1d24ee;color:#fff;font:11px Arial;padding:2px 8px;border-radius:99px;z-index:9999;pointer-events:none;white-space:nowrap}
.safe .stage::after{content:"";position:absolute;inset:8%;border:1px dashed #00c2ff;pointer-events:none;z-index:99}
@keyframes fadeIn{from{opacity:0;transform:translateY(2cqh)}to{opacity:1}}@keyframes zoom{to{transform:scale(1.08)}}
@keyframes parallax{from{transform:scale(1.08)}to{transform:translateY(-2.5cqh) scale(1.08)}}@keyframes pulse{50%{opacity:.35}}
.agent{display:flex;flex-direction:column;background:var(--pan);border-left:1px solid var(--line);min-height:0}
.agent h4{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{max-width:94%;padding:8px 11px;border-radius:12px;background:var(--rai);align-self:flex-start}
.m.u{align-self:flex-end;background:var(--ac);color:#131317}
.cards{display:grid;gap:7px;align-self:stretch}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.card:hover{border-color:var(--ac)}.card b{display:block}.card p{margin:2px 0 7px;color:var(--mu);font-size:12px}
.card .r{display:flex;gap:6px;align-items:center}.card .r small{color:var(--mu);flex:1}
.card pre{margin:7px 0 0;max-height:150px;overflow:auto;font-size:10.5px;background:var(--rai);padding:6px;border-radius:6px}
.card.done{border-color:var(--ok)}
.ctx{margin:0 12px;padding:6px 9px;border:1px dashed var(--hi);border-radius:8px;color:var(--mu);font-size:12px;display:flex;gap:6px;align-items:center}
.ctx b{color:var(--tx)}.ctx button{margin-left:auto;padding:0 6px}
.qp{display:flex;gap:5px;flex-wrap:wrap;padding:8px 12px 0}.qp button{font-size:11px;border-radius:99px}
form{display:flex;gap:6px;padding:10px 12px}input[type=text]{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
form button{background:var(--ac);color:#131317;border:0;font-weight:700}
@media (max-width:980px){body{overflow:auto}#app{height:auto;grid-template-columns:1fr;grid-template-rows:auto}aside{max-height:240px}.wrap{height:80vh;flex:none}.agent{height:70vh}}
</style></head><body>
<div id="app">
<header><span class="logo">A</span><b>Agent Studio</b><span style="color:var(--mu)">The Physician — Flyer · 1748 × 2480</span><span class="sp"></span>
<button id="undo">↶ Undo</button><button id="reset">Reset scene</button></header>
<aside>
<h3>Assets · drag onto canvas</h3><div class="assets" id="assets"></div>
<h3>Brand palette</h3><div class="sw" id="sw"></div>
<h3>Layers</h3><div id="layers"></div>
</aside>
<main>
<div class="tb"><button id="play">▶ Replay</button><label><input type="checkbox" id="sz"> Safe zone</label><span class="sp"></span><span style="color:var(--mu)" id="status">Click a layer, or drag an asset in.</span></div>
<div class="wrap" id="wrap"><div class="stage" id="stage"></div></div>
</main>
<section class="agent">
<h4><span class="dot"></span>Studio agent <span style="color:var(--mu);font-weight:400">sees the selected layer</span></h4>
<div id="chat" aria-live="polite"></div>
<div class="qp" id="qp"></div>
<div class="ctx" id="ctx"></div>
<form id="f"><input type="text" id="in" placeholder="Ask for a change… e.g. “bigger”, “animate it”, “vermilion”" autocomplete="off"><button>Send</button></form>
</section></div>

const MASTER=[
{id:"flyer-ground",name:"Flyer ground",type:"fill",x:0,y:0,w:100,h:100,z:0,opacity:1,color:BONE},
{id:"flyer-photo",name:"Hero photograph",type:"image",x:0,y:0,w:100,h:48,z:2,opacity:1},

{id:"flyer-subhead",name:"Sub-headline",type:"text",x:8,y:69.5,w:84,h:5.5,z:12,opacity:1,text:"Find your cure.",font:F("Georgia",400,2.4,1.2,.06),color:INK},
{id:"flyer-body",name:"Body copy",type:"text",x:8,y:76,w:84,h:8.5,z:12,opacity:.78,text:"Seasonal plates, a considered drinks list and a room built for long lunches. Join us for dinner, private dining or a quiet drink at the bar.",font:F("Georgia",300,1.6,1.45),color:INK},

{id:"flyer-footer",name:"Footer",type:"text",x:8,y:85.2,w:84,h:2.2,z:12,opacity:.6,text:"129 South Street, St Andrews, KY16 9UH · www.thephysician.bar",font:F("Helvetica Neue",400,1.05,1.2,.05),color:INK}];
const ASSETS=[
{k:"photo",n:"Hero photo",st:`background-image:url(${PHOTO})`},
{k:"logo-white",n:"Wordmark · white",st:"background:#222;color:#fff",t:"THE PHYSICIAN"},
{k:"logo-ink",n:"Wordmark · ink",st:"background:#ebe6e0;color:#17162e",t:"THE PHYSICIAN"},
{k:"logo-verm",n:"Wordmark · vermilion",st:"background:#ebe6e0;color:#eb5b3c",t:"THE PHYSICIAN"},
{k:"scrim",n:"Scrim gradient",st:"background:linear-gradient(#17162e00,#17162e)"},
{k:"rule",n:"Rule line",st:"background:linear-gradient(#0000 45%,#eb5b3c 45% 55%,#0000 55%)"},
{k:"badge",n:"Badge",st:"background:#eb5b3c;color:#fff",t:"NEW"},
{k:"text",n:"Text block",st:"background:#ebe6e0;color:#17162e",t:"Aa"}];
const clone=o=>JSON.parse(JSON.stringify(o));
let scene=clone(MASTER),sel=null,hist=[],uid=1,pv=null;
const $=s=>document.querySelector(s),stage=$("#stage");
const TONE={white:"#fff",ink:INK,verm:VERM};
/* ---------- command engine ---------- */
function run(sc,cmds){for(const c of cmds){const g=id=>sc.find(l=>l.id===id);
 if(c.type==="set-layer"){const l=g(c.layerId);if(l)for(const[k,v]of Object.entries(c.patch)){if(k==="font")Object.assign(l.font,v);else l[k]=v}}
 else if(c.type==="add-layer")sc.push(c.layer);
 else if(c.type==="remove-layer"){const i=sc.findIndex(l=>l.id===c.layerId);if(i>-1)sc.splice(i,1)}
 else if(c.type==="swap-asset"){g(c.layerId).tone=c.asset}
 else if(c.type==="set-animation")g(c.layerId).anim={preset:c.preset,start:c.startMs||0,duration:c.durationMs||900};
 else if(c.type==="clear-animation")delete g(c.layerId).anim}return sc}
function commit(cmds,label){hist.push(clone(scene));run(scene,cmds);pv=null;render();layers()}
/* ---------- render ---------- */
function render(sc=scene){stage.innerHTML="";
 for(const l of sc.slice().sort((a,b)=>a.z-b.z)){if(l.hidden)continue;const e=document.createElement("div");e.className="L";e.dataset.id=l.id;
  Object.assign(e.style,{left:l.x+"%",top:l.y+"%",width:l.w+"%",height:l.h+"%",zIndex:l.z,opacity:l.opacity});
  if(l.type==="fill")e.style.background=l.color;
  if(l.type==="gradient")e.style.background=`linear-gradient(${l.from},${l.to})`;
  if(l.type==="shape"){e.style.background=l.color;e.style.borderRadius=(l.radius||0)+"cqh"}
  if(l.type==="image")e.style.background=`url(${PHOTO}) ${l.fx||50}% ${l.fy||50}%/cover`;
  if(l.type==="logo"){e.classList.add("T");e.style.overflow="visible";e.style.justifyContent=l.x<20?"flex-start":"center";
   e.innerHTML=`<span style="font:700 ${l.h*.5}cqh/1 Georgia,serif;white-space:nowrap;color:${TONE[l.tone]||"#fff"}"><small style="font-size:.62em">THE </small>PHYSICIAN</span>`}
  if(l.type==="text"){e.classList.add("T");const f=l.font;e.style.justifyContent=l.align==="center"?"center":"flex-start";
   Object.assign(e.style,{color:l.color,fontFamily:`"${f.family}",${f.family==="Georgia"?"serif":"Arial,sans-serif"}`,fontWeight:f.weight,fontSize:f.sizePct+"cqh",lineHeight:f.lineHeight,letterSpacing:f.letterSpacingEm+"em",textTransform:f.transform});
   if(l.bg){e.style.background=l.bg;e.style.borderRadius=(l.radius||0)+"cqh";e.style.justifyContent="center"}
   e.textContent=l.text;if(l.id==="flyer-footer")e.style.whiteSpace="nowrap"}
  if(l.anim)e.style.animation=`${l.anim.preset} ${l.anim.duration}ms ${l.anim.start}ms both ${l.anim.preset==="pulse"?"infinite":"ease-out"}`;
  if(sc===scene&&l.id===sel){e.classList.add("sel");const c=document.createElement("span");c.className="chip";c.textContent=l.name;e.appendChild(c)}
  e.onpointerdown=ev=>down(ev,l.id);stage.appendChild(e)}}
function down(ev,id){ev.preventDefault();if(sel!==id)select(id);const l=scene.find(q=>q.id===id);if(l.type==="fill")return;
 const r=stage.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=l.x,oy=l.y;let moved=false;const el=ev.currentTarget;
 const mv=m=>{if(!moved){hist.push(clone(scene));moved=true}l.x=+(ox+(m.clientX-sx)/r.width*100).toFixed(1);l.y=+(oy+(m.clientY-sy)/r.height*100).toFixed(1);el.style.left=l.x+"%";el.style.top=l.y+"%"};
 const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);if(moved)say("agent",`Moved ${l.name} to x ${l.x}, y ${l.y}.`)};
 addEventListener("pointermove",mv);addEventListener("pointerup",up)}
/* ---------- panels ---------- */
function layers(){const w=$("#layers");w.innerHTML="";
 scene.slice().sort((a,b)=>b.z-a.z).forEach(l=>{const r=document.createElement("div");r.className="lrow";r.dataset.s=l.id===sel?1:0;
  r.innerHTML=`<span>${l.name}</span><small>${l.type}</small><button title="Show/hide">${l.hidden?"○":"●"}</button>`;
  r.onclick=()=>select(l.id);r.querySelector("button").onclick=e=>{e.stopPropagation();hist.push(clone(scene));l.hidden=!l.hidden;render();layers()};w.appendChild(r)});ctx()}
function ctx(){const l=scene.find(q=>q.id===sel);$("#ctx").innerHTML=l?`Context: <b>${l.name}</b> · ${l.type} · x${l.x} y${l.y} <button id="cx">✕</button>`:"Context: <b>whole flyer</b> · select a layer to focus me";
 if(l)$("#cx").onclick=()=>select(null);
 const q=l?(l.type==="text"?["Rewrite it","Make it stand out","Animate it"]:l.type==="image"?["Crop ideas","Add a scrim","Animate it"]:["Options","Animate it"]):["Layout concepts","Fix hierarchy"];
 $("#qp").innerHTML="";q.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>ask(t);$("#qp").appendChild(b)})}
function select(id){sel=id;render();layers();if(id){const l=scene.find(q=>q.id===id);say("agent",`Looking at <b>${l.name}</b>. Here’s what I’d try:`,suggest(l,""))}}
$("#assets").innerHTML=ASSETS.map(a=>`<div class="asset" draggable="true" data-k="${a.k}"><div class="th" style="${a.st}">${a.t||""}</div>${a.n}</div>`).join("");
$("#sw").innerHTML=Object.entries(PAL).map(([n,h])=>`<i title="${n} ${h}" style="background:${h}"></i>`).join("");
document.querySelectorAll(".asset").forEach(a=>{a.ondragstart=e=>e.dataTransfer.setData("k",a.dataset.k);a.onclick=()=>addAsset(a.dataset.k,50,50)});
$("#wrap").ondragover=e=>e.preventDefault();
$("#wrap").ondrop=e=>{e.preventDefault();const r=stage.getBoundingClientRect();addAsset(e.dataTransfer.getData("k"),(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)};
function addAsset(k,px,py){const id=k+"-"+uid++,z=20+uid;let L;const at=(w,h)=>({x:Math.max(0,Math.min(100-w,+(px-w/2).toFixed(1))),y:Math.max(0,Math.min(100-h,+(py-h/2).toFixed(1))),w,h,z,opacity:1,id});
 if(k==="photo")L={...at(60,28),name:"Photo copy",type:"image"};
 else if(k.startsWith("logo"))L={...at(22,5),name:"Wordmark",type:"logo",tone:{white:"white",ink:"ink",verm:"verm"}[k.slice(5)]};
 else if(k==="scrim")L={...at(100,30),x:0,name:"Scrim",type:"gradient",from:"rgba(23,22,46,0)",to:INK};
 else if(k==="rule")L={...at(30,.5),name:"Rule",type:"shape",color:VERM};
 else if(k==="badge")L={...at(10,4),name:"Badge",type:"text",text:"NEW",bg:VERM,radius:2,font:F("Helvetica Neue",700,1.4,1.2,.12),color:CHALK};
 else L={...at(40,6),name:"New text",type:"text",text:"Your text here",font:F("Georgia",400,2.4,1.2),color:INK};
 hist.push(clone(scene));scene.push(L);say("agent",`Added <b>${L.name}</b> to the canvas.`);select(L.id)}

function suggest(l,msg){const m=msg.toLowerCase(),o=[],id=l.id,add=(title,why,cmds)=>o.push({title,why,cmds});
 const col=Object.keys(PAL).find(n=>m.includes(n.toLowerCase())),has=w=>w.some(x=>m.includes(x));
 if(col&&l.type!=="image")add(`Colour → ${col}`,`Brand palette value ${PAL[col]}.`,[S(id,l.type==="fill"?{color:PAL[col]}:{color:PAL[col]})]);
 if(has(["bigger","larger","increase"]))add("Scale up 20%","Raises presence; I’d check the box still fits.",l.type==="text"?[S(id,{font:{sizePct:+(l.font.sizePct*1.2).toFixed(2)}})]:[S(id,{w:+(l.w*1.2).toFixed(1),h:+(l.h*1.2).toFixed(1)})]);
 if(has(["smaller","reduce"]))add("Scale down 20%","Gives neighbours more room.",l.type==="text"?[S(id,{font:{sizePct:+(l.font.sizePct*.8).toFixed(2)}})]:[S(id,{w:+(l.w*.8).toFixed(1),h:+(l.h*.8).toFixed(1)})]);
 if(has(["up","higher"])&&m.includes("move"))add("Move up 4%","Nudges toward the top.",[S(id,{y:+(l.y-4).toFixed(1)})]);
 if(has(["down","lower"])&&m.includes("move"))add("Move down 4%","Nudges toward the bottom.",[S(id,{y:+(l.y+4).toFixed(1)})]);
 if(has(["center","centre"]))add("Centre horizontally","Aligns to the page axis.",[S(id,{x:+((100-l.w)/2).toFixed(1)}),...(l.type==="text"?[S(id,{align:"center"})]:[])]);
 if(has(["hide","remove","delete"]))add("Remove layer","Deletes it from the scene (undoable).",[{type:"remove-layer",layerId:id}]);
 if(has(["uppercase","caps"])&&l.type==="text")add("Uppercase + tracking","Reads as a label.",[S(id,{font:{transform:"uppercase",letterSpacingEm:.14}})]);
 if(has(["animat","motion","fade","pulse","zoom","parallax"])||msg==="Animate it"){const p=m.includes("pulse")?"pulse":m.includes("zoom")?"zoom":m.includes("parallax")?"parallax":null;
  [["fadeIn","Soft entrance (0.9s)",300,900],["pulse","Draws the eye; good for CTAs",2000,2400],...(l.type==="image"?[["zoom","Slow push-in",0,10000],["parallax","Gentle drift",0,10000]]:[])].filter(a=>!p||a[0]===p).forEach(a=>add(`Animate: ${a[0]}`,a[1],[A(id,a[0],a[2],a[3])]))}
 if(has(["rewrite","alternative","copy","wording"])||msg==="Rewrite it")(COPY[id]||[]).filter(t=>t!==l.text).slice(0,3).forEach(t=>add(`“${t}”`,"Copy option in the brand’s medical-wordplay voice; no new facts.",[S(id,{text:t})]));
 if(!o.length||has(["stand out","options","ideas","crop","scrim","what"])||["Make it stand out","Options","Crop ideas","Add a scrim"].includes(msg)){
  if(l.type==="text"){add("Make it stand out",`Larger, higher contrast. Currently ${l.font.sizePct}% of height.`,[S(id,{font:{sizePct:+(l.font.sizePct*1.25).toFixed(2),weight:400}}),S(id,{opacity:1})]);
   add("Accent in Vermilion","Brand accent for emphasis.",[S(id,{color:VERM})]);if(COPY[id])add("Rewrite it","Show me copy options.",[]),o[o.length-1].ask="Rewrite it"}
  else if(l.type==="image"){add("Full-bleed with scrim","Photo to 66% height fading into Umber.",[S("flyer-ground",{color:UMBER}),S(id,{h:66}),{type:"add-layer",layer:{id:"scrim-"+uid++,name:"Scrim",type:"gradient",x:0,y:36,w:100,h:30.2,z:6,opacity:1,from:"rgba(107,76,53,0)",to:UMBER}}]);
   add("Inset, framed","Inside the 8% margins, like a print.",[S(id,{x:8,y:8,w:84,h:42})]);add("Shift focus left","Moves the crop toward the bread.",[S(id,{fx:25})]);add("Animate: parallax","Gentle drift, 10s.",[A(id,"parallax",0,10000)])}
  else if(l.type==="logo"){[["ink","Ink wordmark"],["verm","Vermilion wordmark"],["white","White wordmark"]].filter(t=>t[0]!==l.tone).forEach(t=>add(t[1],"Swap tone; geometry and aspect preserved.",[{type:"swap-asset",layerId:id,asset:t[0]}]));add("Enlarge 25%","More brand presence.",[S(id,{w:+(l.w*1.25).toFixed(1),h:+(l.h*1.25).toFixed(1)})])}
  else add("Fade to 50%","Softer presence.",[S(id,{opacity:.5})]),add("Send to back","Behind text.",[S(id,{z:1})])}
 return o}

const chat=$("#chat");
function say(who,html,cards=[]){const m=document.createElement("div");m.className="m"+(who==="user"?" u":"");m.innerHTML=html;chat.appendChild(m);
 if(cards.length){const w=document.createElement("div");w.className="cards";cards.forEach(c=>{const d=document.createElement("div");d.className="card";
  d.innerHTML=`<b>${c.title}</b><p>${c.why}</p><div class="r"><small>${c.cmds.length} command${c.cmds.length===1?"":"s"} · hover to preview</small><button data-j>JSON</button><button data-a>Apply</button></div>`;
  d.onmouseenter=()=>{if(c.cmds.length&&!d.classList.contains("done"))render(run(clone(scene),c.cmds))};d.onmouseleave=()=>render();
  d.querySelector("[data-j]").onclick=()=>{let p=d.querySelector("pre");if(p)return p.remove();p=document.createElement("pre");p.textContent=JSON.stringify(c.cmds,null,1);d.appendChild(p)};
  d.querySelector("[data-a]").onclick=e=>{if(c.ask)return ask(c.ask);commit(c.cmds);d.classList.add("done");e.target.textContent="Applied ✓";e.target.disabled=true;$("#status").textContent=`Applied: ${c.title}`};
  w.appendChild(d)});chat.appendChild(w)}
 chat.scrollTop=chat.scrollHeight}
function ask(t){say("user",t);const l=scene.find(q=>q.id===sel);setTimeout(()=>{
 if(!l){const lm=t.toLowerCase();const c=lm.includes("hier")?[CONCEPTS[3]]:CONCEPTS.slice(0,3);say("agent",lm.includes("hier")?"One structural issue I can see:":"Three directions for the whole flyer. Hover to preview each on the canvas:",c)}
 else{const c=suggest(l,t);say("agent",c.length?`For <b>${l.name}</b>:`:`I can’t do that to <b>${l.name}</b> yet. Try “bigger”, “vermilion”, “animate it” or “move up”.`,c)}},300)}
